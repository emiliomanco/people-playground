<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1e23">
<title>People Playground (clon personal)</title>
<style>
:root {
  --panel: rgba(22, 25, 30, 0.92); --panel2: rgba(34, 38, 45, 0.96); --line: #343a43; --line2: #454c57;
  --text: #e3e6ea; --muted: #9aa3ad; --accent: #f0b23c; --accent2: #ffcf6e; --danger: #e05a4f; --good: #7ad48a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2f35; color: var(--text);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif; font-size: 13px;
  user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
canvas#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
button { font: inherit; color: inherit; cursor: pointer; }
img { image-rendering: pixelated; }
canvas { image-rendering: pixelated; }
/* barra superior */
.topbar { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 0 6px; background: linear-gradient(#1d2025f2, #16191df0); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.topbar::-webkit-scrollbar { display: none; }
.topbar .grp { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
.topbar .tools { flex: 1; justify-content: center; }
.topbar .sep { width: 1px; height: 26px; background: var(--line2); margin: 0 5px; }
.tb { width: 34px; height: 34px; border: 1px solid transparent; border-radius: 6px; background: transparent; display: grid; place-items: center; padding: 0; flex-shrink: 0; }
.tb img { width: 24px; height: 24px; }
.tb:hover { background: #2b3038; border-color: var(--line2); }
.tb.on { background: #3a3220; border-color: var(--accent); box-shadow: inset 0 0 0 1px #00000040; }
/* catálogo */
.catalog { position: absolute; left: 0; top: 44px; bottom: 0; display: flex; transition: transform .18s ease; max-height: calc(100% - 44px); }
.catalog.closed { transform: translateX(-100%); }
.cats { width: 56px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; padding: 6px 4px; overflow-y: auto; scrollbar-width: thin; }
.cat { width: 48px; height: 48px; flex-shrink: 0; background: #20242a; border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; padding: 0; }
.cat canvas, .cat img { width: 40px; height: 40px; }
.cat:hover { border-color: var(--line2); background: #282d34; }
.cat.on { border-color: var(--accent); background: #2e2a20; }
.items { width: 286px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.ihead { padding: 9px 12px 8px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 12px; color: var(--accent2); border-bottom: 1px solid var(--line); }
.igrid { flex: 1; overflow-y: auto; padding: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; align-content: start; scrollbar-width: thin; scrollbar-color: #444 transparent; }
.item { background: #1e2227; border: 1px solid var(--line); border-radius: 6px; padding: 4px 1px 5px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 82px; overflow: hidden; }
.item canvas { width: 76px; height: 52px; }
.item span { font-size: 10.5px; line-height: 1.15; text-align: center; color: #cfd5dc; padding: 0 2px; }
.item:hover { border-color: var(--line2); background: #262b31; }
.item.on { border-color: var(--accent); background: #2e2a20; }
.idesc { border-top: 1px solid var(--line); padding: 8px 12px 10px; color: var(--muted); min-height: 64px; font-size: 12px; line-height: 1.35; }
.idesc b { color: var(--text); }
/* información flotante */
.tip { position: absolute; left: 0; top: 0; display: none; pointer-events: none !important; background: rgba(16, 18, 22, 0.92); border: 1px solid var(--line2);
  border-radius: 6px; padding: 6px 9px; font-size: 12px; line-height: 1.4; max-width: 280px; box-shadow: 0 4px 14px #0007; }
.tip .tn { font-weight: 700; color: #fff; }
.tip .tn span { font-weight: 400; color: var(--muted); }
.tip .sub, .help .sub { color: var(--muted); font-size: 11.5px; }
/* menú contextual */
.ctx { position: absolute; display: none; min-width: 190px; max-width: 280px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 7px; padding: 4px; box-shadow: 0 8px 26px #000a; max-height: 80vh; overflow-y: auto; }
.ctx .ct { padding: 6px 9px 7px; font-weight: 700; color: var(--accent2); border-bottom: 1px solid var(--line); margin-bottom: 3px; font-size: 12px; }
.ctx .ci { display: block; width: 100%; text-align: left; padding: 6px 9px; border: 0; background: transparent; border-radius: 5px; font-size: 13px; }
.ctx .ci:hover { background: #343a44; }
.ctx .ci.danger { color: #ff8b80; }
.ctx .csep { height: 1px; background: var(--line); margin: 3px 4px; }
/* avisos */
.toasts { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 5px; pointer-events: none !important; }
.toast { background: rgba(16, 18, 22, 0.9); border: 1px solid var(--line2); padding: 6px 13px; border-radius: 16px; font-size: 12.5px; transition: opacity .35s, transform .35s; text-align: center; max-width: 86vw; }
.toast.out { opacity: 0; transform: translateY(6px); }
.hint { position: absolute; right: 8px; bottom: 8px; max-width: min(640px, 70vw); background: rgba(16, 18, 22, 0.75); border: 1px solid var(--line); padding: 5px 10px; border-radius: 6px; font-size: 12px; color: var(--muted); pointer-events: none !important; }
.hint b { color: var(--accent2); }
.fps { position: absolute; right: 8px; top: 52px; font: 11px ui-monospace, Menlo, Consolas, monospace; color: #9fe39f; background: #0008; padding: 3px 6px; border-radius: 4px; display: none; pointer-events: none !important; }
.pausedtag { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); background: #3a3220e8; border: 1px solid var(--accent); color: var(--accent2); font-weight: 800; letter-spacing: .2em; padding: 4px 14px; border-radius: 5px; display: none; pointer-events: none !important; }
/* botones táctiles */
.touchbar { position: absolute; right: 12px; bottom: 48px; display: flex; flex-direction: column; gap: 10px; }
.touchbar button { width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--line2); background: rgba(22, 25, 30, 0.85); font-size: 22px; font-weight: 800; color: var(--accent2); }
.touchbar button:active { background: #3a3220; border-color: var(--accent); }
/* modales */
.modal { position: absolute; inset: 0; background: rgba(8, 10, 12, 0.55); display: grid; place-items: center; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); padding: 16px; }
.mbox { background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 18px 20px; min-width: min(360px, 92vw); max-width: min(560px, 94vw); max-height: 88vh; overflow-y: auto; box-shadow: 0 16px 50px #000b; }
.mbox h2 { margin: 0 0 12px; font-size: 17px; letter-spacing: .03em; color: var(--accent2); }
.mbox p { color: #cfd5dc; }
.btn { background: #2a2f37; border: 1px solid var(--line2); border-radius: 7px; padding: 9px 16px; font-size: 14px; min-width: 120px; }
.btn:hover { background: #343a44; border-color: #59616d; }
.btn.big { background: #4a3a18; border-color: var(--accent); color: #fff3d6; font-weight: 700; font-size: 16px; padding: 11px 18px; }
.btn.big:hover { background: #5a4720; }
.btn.danger { background: #4a2420; border-color: #a0463c; }
.row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 8px; }
.maps { display: grid; gap: 8px; }
.mapbtn { text-align: left; background: #20242a; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
.mapbtn:hover { border-color: var(--accent); background: #2a2a24; }
.mapbtn span { color: var(--muted); font-size: 12px; }
.settings { display: flex; flex-direction: column; gap: 6px; }
.srow { display: grid; grid-template-columns: 1fr 150px 44px; align-items: center; gap: 10px; padding: 4px 0; border-bottom: 1px solid #2b3038; }
.srow.chk { grid-template-columns: 1fr auto; }
.srow em { font-style: normal; color: var(--muted); font-size: 12px; text-align: right; }
.srow input[type=range] { width: 100%; accent-color: var(--accent); }
.srow input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.help { display: flex; flex-direction: column; gap: 6px; line-height: 1.4; }
.keybtn { min-width: 132px; padding: 5px 10px; font-size: 13px; }
.keybtn.cap { border-color: var(--accent); color: var(--accent2); }
.help b { color: var(--accent2); }
/* menú principal */
.mainmenu { background: radial-gradient(ellipse at center, rgba(10, 12, 15, 0.35), rgba(8, 10, 12, 0.82)); }
.mainmenu .mbox { background: transparent; border: 0; box-shadow: none; text-align: center; min-width: 0; max-width: 96vw; overflow: visible; }
.title { margin-bottom: 26px; }
.title .t1, .title .t2 { font-weight: 900; line-height: .9; letter-spacing: .06em; color: #f2f2ee; text-shadow: 0 4px 0 #0007, 0 0 30px #0008; }
.title .t1 { font-size: clamp(30px, 7vw, 66px); }
.title .t2 { font-size: clamp(34px, 8.4vw, 80px); color: var(--accent); white-space: nowrap; }
.title .t3 { margin-top: 12px; color: #c9ced6; letter-spacing: .08em; font-size: 13px; text-transform: uppercase; }
.mainbtns { display: flex; flex-direction: column; align-items: center; gap: 9px; }
.mainbtns .btn { width: 230px; }
.foot { margin-top: 26px; color: #8a929c; font-size: 11.5px; }
@media (max-width: 700px) {
  .items { width: 196px; }
  .igrid { grid-template-columns: repeat(2, 1fr); }
  .hint { display: none; }
  .topbar .tools { justify-content: flex-start; }
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>

class Sprite {

      this.dirty = false;
    }

  }
  clone() { const s = new Sprite(this.w, this.h); s.data.set(this.data); return s; }
  opaque() {
    if (this._opaque) return this._opaque;
    const o = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) if (this.a(x, y) > 0) o.push([x, y]);
    return (this._opaque = o);
  }

    for (const [x, y] of this.opaque()) {

    const s = new Sprite(this.w, this.h);

      const i = this.idx(x, y), j = s.idx(this.w - 1 - x, y);
      for (let k = 0; k < 4; k++) s.data[j + k] = this.data[i + k];
    }

  }
}

        }
        xs.sort((p, q) => p - q);
        for (let k = 0; k + 1 < xs.length; k += 2) for (let x = Math.round(xs[k]); x < Math.round(xs[k + 1]); x++) s.set(x, y, c);
      }
    },
    map(rows, pal, ox = 0, oy = 0) {
      for (let y = 0; y < rows.length; y++) for (let x = 0; x < rows[y].length; x++) {
        const ch = rows[y][x]; if (ch === '.' || ch === ' ') continue;
        const c = palColor(ch, pal); if (c) s.set(ox + x, oy + y, c);
      }
    },
    // oscurece píxeles de borde (contorno interior)
    edge(f = 0.72, only) {
      const out = [];
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (!s.a(x, y)) continue;
        if (!s.a(x - 1, y) || !s.a(x + 1, y) || !s.a(x, y - 1) || !s.a(x, y + 1)) out.push([x, y]);
      }
      for (const [x, y] of out) s.set(x, y, shadeRgb(s.get(x, y), f));
    },
    // luz desde arriba
    bevel(up = 1.18, down = 0.8) {
      const ops = [];
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (!s.a(x, y)) continue;
        if (!s.a(x, y - 1)) ops.push([x, y, up]); else if (!s.a(x, y + 1)) ops.push([x, y, down]);
      }
      for (const [x, y, f] of ops) s.set(x, y, shadeRgb(s.get(x, y), f));
    },
    noise(amt = 0.08) {
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (!s.a(x, y)) continue;
        s.set(x, y, shadeRgb(s.get(x, y), 1 + (R() * 2 - 1) * amt));
      }
    },
    grainH(amt = 0.12, freq = 0.5) { // vetas de madera
      const rows = [];
      for (let y = 0; y < h; y++) rows.push(1 + (R() * 2 - 1) * amt);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (!s.a(x, y)) continue;
        let f = rows[y] * (1 + Math.sin(x * freq + y * 3.1 + R() * 0.5) * amt * 0.4);
        s.set(x, y, shadeRgb(s.get(x, y), f));
      }
    },
    grainV(amt = 0.12) {
      const cols = [];
      for (let x = 0; x < w; x++) cols.push(1 + (R() * 2 - 1) * amt);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (s.a(x, y)) s.set(x, y, shadeRgb(s.get(x, y), cols[x] * (1 + (R() - 0.5) * amt * 0.3)));
    },
    tint(fn) { for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (s.a(x, y)) { const c = fn(s.get(x, y), x, y); if (c) s.set(x, y, c); } },
    clear(x, y) { if (s.inb(x, y)) { const i = s.idx(x, y); s.data[i + 3] = 0; } },
  };
  fn(api);
  return s;
}

// combina varias capas en un sprite (para miniaturas y vista previa)
function composeSprites(w, h, layers, anchor) {
  const s = new Sprite(w, h);
  for (const L of layers) {
    const sp = L.spr;
    for (let y = 0; y < sp.h; y++) for (let x = 0; x < sp.w; x++) {
      const i = (y * sp.w + x) * 4, a = sp.data[i + 3];
      if (!a) continue;
      const X = Math.round(L.x) + x, Y = Math.round(L.y) + y;
      if (!s.inb(X, Y)) continue;
      const j = s.idx(X, Y), d = s.data, k = a / 255;
      d[j] = lerp(d[j], sp.data[i], k); d[j + 1] = lerp(d[j + 1], sp.data[i + 1], k); d[j + 2] = lerp(d[j + 2], sp.data[i + 2], k);
      d[j + 3] = Math.max(d[j + 3], a);
    }
  }
  s.anchor = anchor || [w / 2, h / 2];
  return s;
}
function defPreview(def) {
  if (def.thumb) return def._thumb || (def._thumb = def.thumb());
  return defSprite(def, false);
}
// lienzo escalado (para miniaturas/iconos)
function spriteThumb(spr, size, pad = 4, bg) {
  const c = makeCanvas(size, size);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, size, size); }
  const sc = Math.max(1, Math.floor(Math.min((size - pad * 2) / spr.w, (size - pad * 2) / spr.h) * 2) / 2);
  const src = spr.canvas || spr;
  const w = spr.w * sc, h = spr.h * sc;
  ctx.drawImage(src, Math.round((size - w) / 2), Math.round((size - h) / 2), w, h);
  return c;
}

// Construye la plantilla de capas de una extremidad
function buildLimbTemplate(name, pal, kind) {
  const rows = LIMB_MAPS[name], bones = BONE_MAPS[name];
  const h = rows.length, w = Math.max(...rows.map((r) => r.length));
  const n = w * h;
  const t = { w, h, base: new Uint8ClampedArray(n * 4), flesh: new Uint8ClampedArray(n * 4), bone: new Uint8Array(n), mat: new Uint8Array(n), mask: new Uint8Array(n) };
  const rng = mulberry32(name.length * 77 + w * 13 + h);
  const fleshCols = kind === 'android' ? ['#2b3036', '#3a4048', '#22262b', '#b8402c', '#2f7fbf', '#d0b040']
    : kind === 'dummy' ? ['#d9d2c2', '#c7bfae', '#e6e0d2']
    : kind === 'zombie' ? ['#6e3a2a', '#5a2c20', '#7d4a33', '#4c5a2a']
    : ['#a62d28', '#8f231f', '#b83a33', '#9a2823', '#c24a3e'];
  const boneCol = kind === 'android' ? hexToRgb('#7a828c') : kind === 'dummy' ? hexToRgb('#555555') : hexToRgb('#e6dfc9');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x] || '.';
    const i = y * w + x;
    if (ch === '.' || ch === ' ') continue;
    let c = palColor(ch, pal);
    if (!c) continue;
    if (kind === 'skeleton') c = boneCol;
    t.mask[i] = 1;
    t.mat[i] = LIMB_MAT[ch] || 4;
    t.base.set([c[0], c[1], c[2], 255], i * 4);
    let fc = hexToRgb(fleshCols[Math.floor(rng() * fleshCols.length)]);
    if (kind === 'android' && rng() < 0.75) fc = hexToRgb(fleshCols[Math.floor(rng() * 3)]);
    t.flesh.set([fc[0], fc[1], fc[2], 255], i * 4);
    const bch = bones && bones[y] ? bones[y][x] : '.';
    t.bone[i] = bch === 'X' ? 1 : 0;
  }
  t.boneCol = boneCol;
  if (kind === 'skeleton') {
    // sólo hueso visible
    for (let i = 0; i < n; i++) if (!t.bone[i]) { t.mask[i] = 0; t.base[i * 4 + 3] = 0; }
  }
  return t;
}

const _origBodyShouldCollide = pl.Body.prototype.shouldCollide;
pl.Body.prototype.shouldCollide = function (that) {
  if (!_origBodyShouldCollide.call(this, that)) return false;
  if (this._nc && this._nc.has(that)) return false;
  return true;
};
function setNoCollide(b1, b2, on) {
  if (!b1 || !b2) return;
  if (on) {
    (b1._nc || (b1._nc = new Set())).add(b2);
    (b2._nc || (b2._nc = new Set())).add(b1);
    for (let ce = b1.getContactList(); ce; ce = ce.next) if (ce.other === b2) ce.contact.flagForFiltering();
  } else {
    if (b1._nc) b1._nc.delete(b2);
    if (b2._nc) b2._nc.delete(b1);
    for (let f = b1.getFixtureList(); f; f = f.getNext()) f.refilter();
  }
}

const Phys = {
  world: null, ground: null,
  substeps: 2, velIters: 8, posIters: 3,
  impacts: [], deferred: [], stepCount: 0, time: 0,
  init() {
    this.world = new pl.World({ gravity: V(0, GRAVITY * Settings.gravity) });
    this.ground = this.world.createBody({ type: 'static' });
    this.world.on('pre-solve', preSolve);
    this.world.on('post-solve', postSolve);
    this.world.on('begin-contact', beginContact);
    this.impacts.length = 0; this.deferred.length = 0;
  },
  setGravity(g) { this.world.setGravity(V(0, GRAVITY * g)); for (let b = this.world.getBodyList(); b; b = b.getNext()) b.setAwake(true); },
  later(fn) { this.deferred.push(fn); },
  runDeferred() {
    let guard = 0;
    while (this.deferred.length && guard++ < 20) {
      const list = this.deferred.splice(0);
      for (const fn of list) { try { fn(); } catch (e) { console.error(e); } }
    }
  },
  step(dt) {
    const sub = dt / this.substeps;
    for (let i = 0; i < this.substeps; i++) {
      for (const t of World.things) if (t.forces && !t.dead) t.forces(sub);
      Input.forces(sub); Connections.forces(sub);
      this.world.step(sub, this.velIters, this.posIters);
      this.time += sub; this.stepCount++;
      processImpacts();
      this.runDeferred();
    }
  },
};

function fixData(f) { return f.getUserData() || {}; }
function bodyData(b) { return b.getUserData() || {}; }
function thingOf(f) { const d = f.getUserData(); return d ? d.thing : null; }

const _wm = new pl.WorldManifold();
function preSolve(contact) {
  const fA = contact.getFixtureA(), fB = contact.getFixtureB();
  // velocidad de aproximación (para distinguir golpes de simples apoyos)
  const wm = contact.getWorldManifold(_wm);
  if (wm && wm.pointCount > 0) {
    const p = wm.points[0], bA = fA.getBody(), bB = fB.getBody();
    const vA = bA.getLinearVelocityFromWorldPoint(p), vB = bB.getLinearVelocityFromWorldPoint(p);
    contact._ap = Math.max(0, -((vB.x - vA.x) * wm.normal.x + (vB.y - vA.y) * wm.normal.y));
  } else contact._ap = 0;
  const dA = fA.getUserData(), dB = fB.getUserData();
  if (!dA || !dB) return;
  // objetos afilados
  if (dA.sharp || dB.sharp) {
    if (dA.sharp && trySharp(contact, fA, fB, dA, dB)) return;
    if (dB.sharp && trySharp(contact, fB, fA, dB, dA)) return;
  }
  // cintas transportadoras
  if (dA.conveyor || dB.conveyor) {
    const cv = dA.conveyor ? dA : dB;
    const th = cv.thing;
    if (th && th.on) contact.setTangentSpeed((dA.conveyor ? 1 : -1) * th.speed);
  }
  // objetos fantasma (no sólidos) p.ej. láser
  if (dA.ghost || dB.ghost) contact.setEnabled(false);
  if (dA.thing && dA.thing.preSolve) dA.thing.preSolve(contact, fA, fB);
  if (dB.thing && dB.thing.preSolve) dB.thing.preSolve(contact, fB, fA);
}

function postSolve(contact, impulse) {
  let J = 0;
  const n = impulse.normalImpulses;
  for (let i = 0; i < n.length; i++) J += n[i];
  if (J < 0.4) return;
  const fA = contact.getFixtureA(), fB = contact.getFixtureB();
  const bA = fA.getBody(), bB = fB.getBody();
  const mA = bA.getMass() || 1e9, mB = bB.getMass() || 1e9;
  const ap = contact._ap || 0;
  const cap = ap * 2 + 0.5;
  const dvA = Math.min(J / mA, cap), dvB = Math.min(J / mB, cap);
  if (Math.max(dvA, dvB) < 1.0) return;
  const wm = contact.getWorldManifold(null);
  if (!wm || !wm.points.length) return;
  const p = wm.points[0];
  Phys.impacts.push({ fA, fB, bA, bB, J, ap, dvA, dvB, x: p.x, y: p.y, nx: wm.normal.x, ny: wm.normal.y });
}

function beginContact(contact) {
  const fA = contact.getFixtureA(), fB = contact.getFixtureB();
  const dA = fA.getUserData(), dB = fB.getUserData();
  if (dA && dA.thing && dA.thing.onTouch) Phys.later(() => dA.thing.onTouch(fA, fB));
  if (dB && dB.thing && dB.thing.onTouch) Phys.later(() => dB.thing.onTouch(fB, fA));
}

function processImpacts() {
  const list = Phys.impacts; if (!list.length) return;
  Phys.impacts = [];
  for (const im of list) {
    const dA = im.fA.getUserData() || {}, dB = im.fB.getUserData() || {};
    const tA = dA.thing, tB = dB.thing;
    // sonido
    const matA = MATERIALS[dA.mat] || MATERIALS.concrete, matB = MATERIALS[dB.mat] || MATERIALS.concrete;
    const dvMin = Math.min(im.dvA, im.dvB);
    if (dvMin > 1.4 || (im.J > 6 && Math.max(im.dvA, im.dvB) > 1.2)) {
      const lighter = im.dvA > im.dvB ? 'A' : 'B';
      let snd = lighter === 'A' ? matA.sound : matB.sound;
      const other = lighter === 'A' ? matB.sound : matA.sound;
      if ((SOUND_PRIO[other] || 0) > (SOUND_PRIO[snd] || 0) && Math.max(im.dvA, im.dvB) > 3) snd = other;
      const bodyKey = (lighter === 'A' ? im.bA : im.bB);
      const vol = clamp(Math.log2(1 + Math.max(im.dvA, im.dvB) * 0.6) / 3.2, 0.05, 1);
      const pitch = clamp(1.4 - Math.log10(1 + Math.min(im.bA.getMass() || 999, im.bB.getMass() || 999)) * 0.35, 0.6, 1.5);
      if (dA.thing && dA.thing.def && dA.thing.def.pan) snd = 'pan';
      if (dB.thing && dB.thing.def && dB.thing.def.pan) snd = 'pan';
      Sound.play(snd, im.x, im.y, vol, { key: bodyKey, gap: 70, pitch });
    }
    if (tA && tA.onImpact && !tA.dead) tA.onImpact(im, im.bA, im.fA, im.bB, im.fB, im.dvA, 1);
    if (tB && tB.onImpact && !tB.dead) tB.onImpact(im, im.bB, im.fB, im.bA, im.fA, im.dvB, -1);
  }
}

function rayAll(x1, y1, x2, y2) {
  const hits = [];
  if (Math.hypot(x2 - x1, y2 - y1) < 1e-4) return hits;
  Phys.world.rayCast(V(x1, y1), V(x2, y2), (f, p, n, frac) => {
    hits.push({ f, b: f.getBody(), d: f.getUserData() || {}, x: p.x, y: p.y, nx: n.x, ny: n.y, frac });
    return 1;
  });
  hits.sort((a, b) => a.frac - b.frac);
  return hits;
}
function rayFirst(x1, y1, x2, y2, filter) {
  let best = null;
  if (Math.hypot(x2 - x1, y2 - y1) < 1e-4) return null;
  Phys.world.rayCast(V(x1, y1), V(x2, y2), (f, p, n, frac) => {
    if (filter && !filter(f)) return -1;
    best = { f, b: f.getBody(), d: f.getUserData() || {}, x: p.x, y: p.y, nx: n.x, ny: n.y, frac };
    return frac;
  });
  return best;
}
function queryAABB(x0, y0, x1, y1, cb) {
  Phys.world.queryAABB(pl.AABB(V(Math.min(x0, x1), Math.min(y0, y1)), V(Math.max(x0, x1), Math.max(y0, y1))), cb);
}
function fixturesAt(x, y, r = 0.0) {
  const out = [];
  const p = V(x, y);
  queryAABB(x - r - 0.001, y - r - 0.001, x + r + 0.001, y + r + 0.001, (f) => {
    if (f.testPoint(p)) out.push(f);
    else if (r > 0) {
      // aproximación: comprobar algunos puntos alrededor
      for (let k = 0; k < 8; k++) { const a = (k / 8) * TAU; if (f.testPoint(V(x + Math.cos(a) * r, y + Math.sin(a) * r))) { out.push(f); break; } }
    }
    return true;
  });
  return out;
}
function bodiesInRadius(x, y, r, cb) {
  const seen = new Set();
  queryAABB(x - r, y - r, x + r, y + r, (f) => {
    const b = f.getBody();
    if (seen.has(b)) return true;
    seen.add(b);
    const c = b.getWorldCenter();
    const d = Math.hypot(c.x - x, c.y - y);
    if (d <= r + 0.5) cb(b, d, f);
    return true;
  });
}

const World = {
  things: [], zc: 0, terrain: [], map: null,
  add(t) { this.things.push(t); return t; },
  remove(t) { const i = this.things.indexOf(t); if (i >= 0) this.things.splice(i, 1); },
  clearAll(keepTerrain = true) {
    for (const t of [...this.things]) if (!(keepTerrain && t.isTerrain)) t.destroy(true);
    Effects.clear(); Decals.clear();
    Connections.clear();
  },
  countDynamic() { return this.things.filter((t) => !t.isTerrain).length; },
  insideTerrain(x, y) {
    for (const r of this.terrain) {
      if (x < r.x0 || x > r.x1 || y < r.y0 || y > r.y1) continue;
      if (!r.poly) return r;
      if (pointInPoly(x, y, r.poly)) return r;
    }
    return null;
  },
};
function pointInPoly(x, y, poly) {
  let ins = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) ins = !ins;
  }
  return ins;
}

class Thing {
  constructor(def) {
    this.id = uid();
    this.def = def || {};
    this.name = (def && def.name) || 'Objeto';
    this.bodies = [];
    this.joints = [];
    this.parts = [];
    this.dead = false;
    this.z = ++World.zc;
    this.frozen = false;
    this.fire = 0; this.fireT = 0; this.fuel = 0; this.char = 0;
    this.links = new Set();
    this.conns = new Set();
    this.age = 0;
    this.flip = false;
    this.loops = [];
  }
  get main() { return this.bodies[0]; }
  pos() { const b = this.bodies[0]; return b ? b.getPosition() : V(0, 0); }
  addBody(b, part) {
    b.setUserData({ thing: this, part });
    this.bodies.push(b);
    return b;
  }
  mass() { let m = 0; for (const b of this.bodies) m += b.getMass(); return m; }
  ownsBody(b) { return this.bodies.includes(b); }
  update(dt) { this.age += dt; }
  activate() {}
  menu() { return []; }
  info() { return []; }
  isFlammable() { return false; }
  // ----- congelar -----
  setFrozen(on) {
    this.frozen = on;
    for (const b of this.bodies) {
      if (on) { b._wasType = b.getType(); b.setType('static'); }
      else { b.setType('dynamic'); b.setAwake(true); }
    }
  }
  // ----- destrucción -----
  destroy(silent) {
    if (this.dead) return;
    this.dead = true;
    if (this.onDestroy) this.onDestroy();
    for (const l of this.loops) l && l.stop();
    this.loops = [];
    Input.releaseThing(this);
    Connections.removeThing(this);
    for (const o of this.links) o.links.delete(this);
    this.links.clear();
    Stuck.removeThing(this);
    Holding.removeThing(this);
    const w = Phys.world;
    for (const j of this.joints) { try { w.destroyJoint(j); } catch (e) {} }
    this.joints = [];
    for (const b of this.bodies) {
      if (b._nc) for (const o of b._nc) if (o._nc) o._nc.delete(b);
      try { w.destroyBody(b); } catch (e) {}
    }
    this.bodies = [];
    World.remove(this);
    if (!silent) Sound.play('delete');
  }
  // ----- fuego -----
  ignite(power = 1) {
    if (!this.isFlammable() || this.dead) return false;
    if (this.fire <= 0) {
      this.fire = 0.15 * power;
      this.fireT = 0;
      if (this.fuel <= 0) this.fuel = this.def.fuel || 12;
      Sound.play('ignite', this.pos().x, this.pos().y, 0.5, { key: 'ign' + this.id, gap: 500 });
    }
    return true;
  }
  extinguish() { if (this.fire > 0) { this.fire = 0; const p = this.pos(); Effects.smoke(p.x, p.y, 6); } }
  updateFire(dt) {
    if (this.fire <= 0) return;
    this.fireT += dt;
    this.fire = Math.min(1, this.fire + dt * 0.35);
    this.fuel -= dt * this.fire;
    this.char = Math.min(1, this.char + dt * 0.02 * this.fire);
    // emitir partículas sobre la superficie
    for (const part of this.parts) {
      if (!part.body || !part.spr) continue;
      const n = Math.random() < this.fire * 0.9 ? 1 + (Math.random() < 0.4 ? 1 : 0) : 0;
      for (let i = 0; i < n; i++) {
        const p = randomPointOnPart(part);
        if (p) Effects.fire(p[0], p[1], this.fire);
      }
    }
    if (Math.random() < dt * 4) {
      const p = this.pos();
      Sound.play('crackle', p.x, p.y, 0.6 * this.fire);
    }
    // propagar
    if (Math.random() < dt * 3) spreadFire(this);
    if (this.fuel <= 0) { this.fire = 0; this.onBurnedOut && this.onBurnedOut(); }
  }
  // ----- manchas -----
  stain(x, y, col, part) {
    const p = part || this.partAt(x, y);
    if (!p || !p.spr || p.noStain) return false;
    if (!p.ownSpr) { p.spr = p.spr.clone(); p.ownSpr = true; }
    const lp = partLocalPx(p, x, y);
    const sx = Math.floor(lp[0]), sy = Math.floor(lp[1]);
    let best = null, bd = 9;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      if (p.spr.a(sx + ox, sy + oy) > 0) { const d = ox * ox + oy * oy; if (d < bd) { bd = d; best = [sx + ox, sy + oy]; } }
    }
    if (!best) return false;
    const c = p.spr.get(best[0], best[1]);
    p.spr.set(best[0], best[1], mixRgb(c, col, 0.65));
    return true;
  }
  partAt(x, y) {
    const pt = V(x, y);
    for (const part of this.parts) {
      if (!part.body) continue;
      for (let f = part.body.getFixtureList(); f; f = f.getNext()) if (f.testPoint(pt)) return part;
    }
    // la más cercana
    let best = null, bd = 1e9;
    for (const part of this.parts) {
      if (!part.body) continue;
      const p = part.body.getPosition(); const d = Math.hypot(p.x - x, p.y - y);
      if (d < bd) { bd = d; best = part; }
    }
    return best;
  }
}

// coordenadas locales (en píxeles de sprite) de un punto del mundo sobre una parte
function partLocalPx(part, x, y) {
  const b = part.body, p = b.getPosition(), a = b.getAngle();
  const dx = x - p.x, dy = y - p.y;
  const c = Math.cos(-a), s = Math.sin(-a);
  let lx = (dx * c - dy * s) / PX, ly = (dx * s + dy * c) / PX;
  lx -= part.ox || 0; ly -= part.oy || 0;
  if (part.flip) lx = -lx;
  return [lx + part.spr.w / 2, ly + part.spr.h / 2];
}
function partWorldPt(part, sx, sy) {
  let lx = sx - part.spr.w / 2, ly = sy - part.spr.h / 2;
  if (part.flip) lx = -lx;
  lx += part.ox || 0; ly += part.oy || 0;
  const b = part.body, p = b.getPosition(), a = b.getAngle();
  const r = rot(lx * PX, ly * PX, a);
  return [p.x + r[0], p.y + r[1]];
}
function randomPointOnPart(part) {
  const op = part.spr.opaque();
  if (!op.length) return null;
  const q = op[(Math.random() * op.length) | 0];
  return partWorldPt(part, q[0] + Math.random(), q[1] + Math.random());
}
function spreadFire(t) {
  for (const b of t.bodies) {
    const aabb = bodyAABB(b, 0.12);
    queryAABB(aabb[0], aabb[1], aabb[2], aabb[3], (f) => {
      const o = thingOf(f);
      if (!o || o === t || o.dead || o.fire > 0) return true;
      const m = MATERIALS[fixData(f).mat];
      if (m && Math.random() < m.flammable * 0.25 * t.fire) {
        if (o.igniteAt) o.igniteAt(f, t.fire); else o.ignite(0.6);
      }
      return true;
    });
  }
}
function bodyAABB(b, pad = 0) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let f = b.getFixtureList(); f; f = f.getNext()) {
    const bb = f.getAABB(0);
    x0 = Math.min(x0, bb.lowerBound.x); y0 = Math.min(y0, bb.lowerBound.y);
    x1 = Math.max(x1, bb.upperBound.x); y1 = Math.max(y1, bb.upperBound.y);
  }
  return [x0 - pad, y0 - pad, x1 + pad, y1 + pad];
}
function thingAABB(t, pad = 0) {
  let r = [1e9, 1e9, -1e9, -1e9];
  for (const b of t.bodies) { const q = bodyAABB(b, pad); r = [Math.min(r[0], q[0]), Math.min(r[1], q[1]), Math.max(r[2], q[2]), Math.max(r[3], q[3])]; }
  return r;
}

/* =========================================================================

   ========================================================================= */
const PT = { BLOOD: 0, SPARK: 1, FIRE: 2, SMOKE: 3, DEBRIS: 4, CASING: 5, GORE: 6, GLASS: 7, FOAM: 8, EMBER: 9, ASH: 10, OIL: 11, JUICE: 12, ESPARK: 13, DUST: 14, FLAME: 15, ACID: 16, SNOW: 17 };
const BLOOD_COLS = [[122, 10, 8], [140, 14, 10], [104, 6, 6], [158, 22, 16]].map((c) => c.concat(255));
const Effects = {
  max: 7000, n: 0,
  init() {
    const M = this.max;
    this.x = new Float32Array(M); this.y = new Float32Array(M); this.vx = new Float32Array(M); this.vy = new Float32Array(M);
    this.life = new Float32Array(M); this.ml = new Float32Array(M); this.sz = new Float32Array(M);
    this.type = new Uint8Array(M); this.r = new Uint8Array(M); this.g = new Uint8Array(M); this.b = new Uint8Array(M);
    this.rot = new Float32Array(M); this.vr = new Float32Array(M); this.fl = new Uint8Array(M); this.owner = new Array(M);
    this.tracers = []; this.bolts = []; this.flashes = []; this.waves = []; this.lights = []; this.beams = []; this.fireballs = []; this.emitters = [];
    this.n = 0;
  },
  clear() { this.n = 0; this.tracers.length = 0; this.bolts.length = 0; this.flashes.length = 0; this.waves.length = 0; this.beams.length = 0; this.fireballs.length = 0; this.emitters.length = 0; },
  fireball(x, y, r, life = 0.4, vy = 0) { this.fireballs.push({ x, y, r, life, ml: life, vy }); },
  emitter(fn, dur) { this.emitters.push({ fn, t: 0, dur }); },
  add(type, x, y, vx, vy, life, size, col, flags = 0, owner = null) {
    let i;
    if (this.n >= this.max * Settings.particleMul) {
      i = (Math.random() * this.n) | 0; // reemplaza uno aleatorio
    } else i = this.n++;
    this.x[i] = x; this.y[i] = y; this.vx[i] = vx; this.vy[i] = vy;
    this.life[i] = life; this.ml[i] = life; this.sz[i] = size; this.type[i] = type;
    this.r[i] = col[0]; this.g[i] = col[1]; this.b[i] = col[2];
    this.rot[i] = Math.random() * TAU; this.vr[i] = 0; this.fl[i] = flags; this.owner[i] = owner;
    return i;
  },
  kill(i) {
    const j = --this.n;
    if (i !== j) {
      this.x[i] = this.x[j]; this.y[i] = this.y[j]; this.vx[i] = this.vx[j]; this.vy[i] = this.vy[j];
      this.life[i] = this.life[j]; this.ml[i] = this.ml[j]; this.sz[i] = this.sz[j]; this.type[i] = this.type[j];
      this.r[i] = this.r[j]; this.g[i] = this.g[j]; this.b[i] = this.b[j]; this.rot[i] = this.rot[j]; this.vr[i] = this.vr[j];
      this.fl[i] = this.fl[j]; this.owner[i] = this.owner[j];
    }
    this.owner[j] = null;
  },
  // ---------------- emisores ----------------
  blood(x, y, vx, vy, n = 6, spread = 1.5, kind = 'blood') {
    n = Math.round(n * Settings.blood);
    const type = kind === 'oil' ? PT.OIL : kind === 'juice' ? PT.JUICE : PT.BLOOD;
    for (let i = 0; i < n; i++) {
      let c = kind === 'oil' ? [20 + rand(15), 20 + rand(15), 24 + rand(15)] : kind === 'juice' ? [200 + rand(40), 40 + rand(30), 60 + rand(30)] : pick(BLOOD_COLS);
      this.add(type, x, y, vx + gauss() * spread, vy + gauss() * spread, rand(1.5, 4), rand(0.8, 1.6), c);
    }
  },
  gore(x, y, n = 12, power = 4, kind = 'flesh', dx = 0, dy = 0) {
    for (let i = 0; i < n; i++) {
      const a = rand(TAU), s = rand(0.5, power);
      const bx = dx * power * rand(0.3, 1.2), by = dy * power * rand(0.3, 1.2);
      const c = kind === 'robot' ? pick([[60, 64, 70], [120, 126, 134], [40, 40, 44], [200, 160, 40]]) : kind === 'dummy' ? pick([[230, 200, 60], [220, 215, 200], [40, 40, 40]]) : pick([[150, 30, 26], [120, 18, 16], [190, 60, 50], [225, 215, 190], [170, 40, 36]]);
      this.add(PT.GORE, x, y, Math.cos(a) * s + bx, Math.sin(a) * s - rand(1, 3) + by, rand(3, 7), rand(1.5, 3.2), c);
    }
    if (kind === 'flesh') this.blood(x, y, dx * power * 0.6, dy * power * 0.6 - 2, n * 3, power * 0.8);
    else if (kind === 'robot') this.sparks(x, y, 0, 0, 14, 4);
  },
  sparks(x, y, vx, vy, n = 8, spd = 4, col) {
    for (let i = 0; i < n; i++) {
      const a = rand(TAU), s = rand(0.3, 1) * spd;
      this.add(col === 'blue' ? PT.ESPARK : PT.SPARK, x, y, vx + Math.cos(a) * s, vy + Math.sin(a) * s, rand(0.15, 0.6), rand(0.6, 1.2), col === 'blue' ? [140, 220, 255] : [255, rand(190, 240), rand(80, 140)]);
    }
    this.light(x, y, 1.2, col === 'blue' ? [120, 200, 255] : [255, 200, 120], 0.6, 0.08);
  },
  debris(x, y, vx, vy, n, col, size = 1.2) {
    for (let i = 0; i < n; i++) {
      const c = shadeRgb(col, rand(0.75, 1.15));
      this.add(PT.DEBRIS, x, y, vx + gauss() * 2.5, vy + gauss() * 2.5 - 1, rand(1.5, 4), rand(0.7, 1.4) * size, c);
    }
  },
  dust(x, y, n = 4, col = [150, 150, 150]) {
    for (let i = 0; i < n; i++) this.add(PT.DUST, x, y, gauss() * 0.8, gauss() * 0.8 - 0.4, rand(0.4, 1.0), rand(2, 4), shadeRgb(col, rand(0.85, 1.1)));
  },
  smoke(x, y, n = 3, col = [80, 80, 84], spd = 0.6, size = 1) {
    for (let i = 0; i < n; i++) this.add(PT.SMOKE, x + gauss() * 0.05, y + gauss() * 0.05, gauss() * spd, -rand(0.3, 1) * spd, rand(1.5, 4), rand(4, 9) * size, shadeRgb(col, rand(0.8, 1.2)));
  },
  fire(x, y, power = 1, vx = 0, vy = 0) {
    const c = pick([[255, 220, 90], [255, 170, 50], [250, 120, 30], [255, 240, 150]]);
    this.add(PT.FIRE, x + gauss() * 0.02, y + gauss() * 0.02, vx + gauss() * 0.3, vy - rand(0.4, 1.4), rand(0.25, 0.7) * (0.6 + power * 0.5), rand(1.5, 3.2) * (0.6 + power * 0.5), c);
    if (Math.random() < 0.05) this.add(PT.EMBER, x, y, gauss() * 0.6, -rand(0.8, 2), rand(0.8, 2), 0.7, [255, 160, 60]);
    if (Math.random() < 0.18) this.smoke(x, y - 0.1, 1, [60, 58, 56], 0.5, 0.8);
  },
  flame(x, y, vx, vy, owner) { // lanzallamas: prende lo que toca
    const c = pick([[255, 230, 120], [255, 180, 60], [255, 140, 40]]);

  acid(x, y, vx, vy) { this.add(PT.ACID, x, y, vx, vy, rand(1.5, 3), rand(0.8, 1.4), [150, 230, 60]); },
  ash(x, y, n = 6) {

  casing(x, y, vx, vy, big) {

  glass(x, y, n = 10, power = 3) {
    for (let i = 0; i < n; i++) {

  },
  tracer(x1, y1, x2, y2, col = [255, 236, 170], w = 1.2, life = 0.06) { this.tracers.push({ x1, y1, x2, y2, col, w, life, ml: life }); },
  beam(x1, y1, x2, y2, col, w, life) { this.beams.push({ x1, y1, x2, y2, col, w, life, ml: life }); },
  bolt(x1, y1, x2, y2, col = [170, 220, 255], life = 0.18, w = 1.6, jag = 0.35) {

  wave(x, y, r, life = 0.35, col = [255, 255, 255]) { this.waves.push({ x, y, r, life, ml: life, col }); },

  // ---------------- simulación ----------------
  update(dt) {
    const g = GRAVITY * Settings.gravity;
    let checks = 0;
    const frame = Phys.stepCount;
    for (let i = this.n - 1; i >= 0; i--) {
      const t = this.type[i];
      this.life[i] -= dt;
      if (this.life[i] <= 0) { this.kill(i); continue; }
      let x = this.x[i], y = this.y[i];

        case PT.BLOOD: case PT.OIL: case PT.JUICE: case PT.GORE: case PT.ACID: {

                else th.stain(nx, ny, [this.r[i], this.g[i], this.b[i], 255]);

          if (World.insideTerrain(nx, ny)) {
            if (!World.insideTerrain(nx, y)) { this.vy[i] *= -0.35; ny = y; this.vx[i] *= 0.6; }
            else if (!World.insideTerrain(x, ny)) { this.vx[i] *= -0.4; nx = x; }
            else { nx = x; ny = y; this.vx[i] = 0; this.vy[i] = 0; }

            this.vr[i] *= 0.5;
          }
          this.x[i] = nx; this.y[i] = ny; this.rot[i] += this.vr[i] * dt;
          break;
        }
        case PT.FIRE: case PT.EMBER: {
          this.vy[i] -= 2.2 * dt; this.vx[i] *= 0.97;
          this.x[i] += this.vx[i] * dt; this.y[i] += this.vy[i] * dt;

        }
        case PT.FLAME: {
          this.vy[i] -= 1.5 * dt; this.vx[i] *= 0.96; this.vy[i] *= 0.96;
          const nx = x + this.vx[i] * dt, ny = y + this.vy[i] * dt;
          if (World.insideTerrain(nx, ny)) { this.vx[i] *= -0.2; this.vy[i] *= -0.2; }
          else { this.x[i] = nx; this.y[i] = ny; }
          if (((i + frame) % 3) === 0 && checks < 450) {
            checks++;
            const hf = pointFixture(nx, ny);
            if (hf) {
              const th = thingOf(hf);
              if (th && th !== this.owner[i] && !th.isTerrain) {

        }
        case PT.FOAM: {
          this.vy[i] += g * dt * 0.5; this.vx[i] *= 0.97;
          const nx = x + this.vx[i] * dt, ny = y + this.vy[i] * dt;
          if (World.insideTerrain(nx, ny)) { this.vx[i] *= 0.2; this.vy[i] = 0; this.life[i] = Math.min(this.life[i], 0.6); }
          else { this.x[i] = nx; this.y[i] = ny; }
          if (((i + frame) % 3) === 0 && checks < 450) {

            if (hf) { const th = thingOf(hf); if (th && th !== this.owner[i]) { th.extinguish && th.extinguish(); this.vx[i] *= 0.3; this.vy[i] *= 0.3; } }
          }
          break;
        }
        case PT.SMOKE: case PT.DUST: case PT.ASH: {
          this.vy[i] -= (t === PT.ASH ? 0.4 : 0.6) * dt; this.vx[i] *= 0.985; this.vy[i] *= 0.985;

    }
    // efectos temporales
    const dec = (arr) => { for (let i = arr.length - 1; i >= 0; i--) { arr[i].life -= dt; if (arr[i].life <= 0) arr.splice(i, 1); } };
    dec(this.tracers); dec(this.bolts); dec(this.flashes); dec(this.waves); dec(this.beams);
    for (let i = this.fireballs.length - 1; i >= 0; i--) { const f = this.fireballs[i]; f.life -= dt; f.y += f.vy * dt; if (f.life <= 0) this.fireballs.splice(i, 1); }
    for (let i = this.emitters.length - 1; i >= 0; i--) { const e = this.emitters[i]; e.t += dt; try { e.fn(e, dt); } catch (er) {} if (e.t >= e.dur) this.emitters.splice(i, 1); }
    for (let i = this.lights.length - 1; i >= 0; i--) { const l = this.lights[i]; if (l.temp) { l.life -= dt; if (l.life <= 0) this.lights.splice(i, 1); } }
  },
  // ---------------- dibujo ----------------
  draw(ctx, cam) {
    const z = cam.zoom;
    const pxs = PX;
    const v = cam.bounds(1);
    // humo detrás
    for (let i = 0; i < this.n; i++) {
      const t = this.type[i];
      if (t !== PT.SMOKE && t !== PT.DUST) continue;
      const x = this.x[i], y = this.y[i];
      if (x < v[0] || x > v[2] || y < v[1] || y > v[3]) continue;
      const lf = this.life[i] / this.ml[i];
      const a = (t === PT.DUST ? 0.3 : 0.26) * Math.min(1, lf * 2) * Math.min(1, (1 - lf) * 6 + 0.2);
      ctx.fillStyle = `rgba(${this.r[i]},${this.g[i]},${this.b[i]},${a})`;
      const s = this.sz[i] * pxs;
      if (s * z < 6) ctx.fillRect(x - s / 2, y - s / 2, s, s);
      else { ctx.beginPath(); ctx.arc(x, y, s / 2, 0, TAU); ctx.fill(); }
    }
    for (let i = 0; i < this.n; i++) {
      const t = this.type[i];
      if (t === PT.SMOKE || t === PT.DUST) continue;
      const x = this.x[i], y = this.y[i];
      if (x < v[0] || x > v[2] || y < v[1] || y > v[3]) continue;
      const lf = this.life[i] / this.ml[i];
      let s = this.sz[i] * pxs;
      let a = 1;
      let r = this.r[i], g = this.g[i], b = this.b[i];
      if (t === PT.FIRE || t === PT.FLAME) {
        // amarillo -> naranja -> rojo oscuro
        const k = 1 - lf;
        r = 255; g = Math.max(40, this.g[i] * (1 - k * 0.9)); b = Math.max(10, this.b[i] * (1 - k));
        a = Math.min(1, lf * 2.5); s *= 0.4 + lf * 0.8;
      } else if (t === PT.SPARK || t === PT.ESPARK || t === PT.EMBER) {
        a = Math.min(1, lf * 3);
      } else if (t === PT.CASING || t === PT.GLASS || t === PT.DEBRIS || t === PT.ASH) {
        a = Math.min(1, lf * 4);
      } else if (t === PT.FOAM) {
        a = Math.min(0.9, lf * 3);
      }
      ctx.fillStyle = `rgba(${r},${g | 0},${b | 0},${a})`;
      if (t === PT.CASING) {

      } else if (t === PT.SPARK || t === PT.ESPARK) {

        ctx.fillRect(x - s / 2, y - s / 2, s, s);

      } else {

      }
    }
    // trazadoras
    ctx.lineCap = 'butt';
    for (const tr of this.tracers) {
      const a = tr.life / tr.ml;
      ctx.strokeStyle = `rgba(${tr.col[0]},${tr.col[1]},${tr.col[2]},${a})`;
      ctx.lineWidth = tr.w * PX;
      ctx.beginPath(); ctx.moveTo(tr.x1, tr.y1); ctx.lineTo(tr.x2, tr.y2); ctx.stroke();
    }
    for (const bm of this.beams) {
      const a = bm.life / bm.ml;
      ctx.strokeStyle = `rgba(${bm.col[0]},${bm.col[1]},${bm.col[2]},${a * 0.5})`;
      ctx.lineWidth = bm.w * PX * 3;
      ctx.beginPath(); ctx.moveTo(bm.x1, bm.y1); ctx.lineTo(bm.x2, bm.y2); ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${a})`;
      ctx.lineWidth = bm.w * PX;
      ctx.beginPath(); ctx.moveTo(bm.x1, bm.y1); ctx.lineTo(bm.x2, bm.y2); ctx.stroke();
    }
    const minW = 1.6 / z;
    for (const bo of this.bolts) {
      const a = Math.min(1, (bo.life / bo.ml) * 1.6);
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.strokeStyle = `rgba(${bo.col[0]},${bo.col[1]},${bo.col[2]},${a * 0.25})`;
      ctx.lineWidth = Math.max(bo.w * PX * 6, minW * 4);
      ctx.beginPath(); bo.pts.forEach((p, k) => (k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke();
      ctx.strokeStyle = `rgba(${bo.col[0]},${bo.col[1]},${bo.col[2]},${a * 0.7})`;
      ctx.lineWidth = Math.max(bo.w * PX * 2.4, minW * 2);
      ctx.beginPath(); bo.pts.forEach((p, k) => (k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke();
      ctx.strokeStyle = `rgba(245,252,255,${a})`;
      ctx.lineWidth = Math.max(bo.w * PX, minW);
      ctx.beginPath(); bo.pts.forEach((p, k) => (k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke();
      ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
    }
    for (const f of this.fireballs) {
      const k = f.life / f.ml, r = f.r * (1.25 - k * 0.45);
      const gr = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
      gr.addColorStop(0, `rgba(255,250,220,${0.95 * k})`);
      gr.addColorStop(0.35, `rgba(255,190,80,${0.85 * k})`);
      gr.addColorStop(0.7, `rgba(220,80,30,${0.55 * k})`);
      gr.addColorStop(1, 'rgba(120,30,10,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.fill();
    }
    for (const w of this.waves) {
      const k = 1 - w.life / w.ml;
      ctx.strokeStyle = `rgba(${w.col[0]},${w.col[1]},${w.col[2]},${(1 - k) * 0.5})`;
      ctx.lineWidth = Math.max(PX * 2, w.r * 0.04 * (1 - k));
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r * smooth(k), 0, TAU); ctx.stroke();
    }
    for (const f of this.flashes) {
      const k = f.life / f.ml;
      const gr = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      gr.addColorStop(0, `rgba(255,255,240,${0.95 * k * f.intensity})`);
      gr.addColorStop(0.35, `rgba(${f.col[0]},${f.col[1]},${f.col[2]},${0.7 * k * f.intensity})`);
      gr.addColorStop(1, `rgba(${f.col[0]},${f.col[1]},${f.col[2]},0)`);
      ctx.fillStyle = gr;
      ctx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
    }
  },
  // luces de partículas (agrupadas) para el mapa de luz
  collectLights(out) {
    let cnt = 0;
    for (let i = 0; i < this.n && cnt < 120; i++) {
      const t = this.type[i];
      if (t === PT.FIRE || t === PT.FLAME) { if ((i & 3) === 0) { out.push({ x: this.x[i], y: this.y[i], r: 1.6, col: [255, 150, 60], intensity: 0.55 * (this.life[i] / this.ml[i]) }); cnt++; } }
      else if (t === PT.SPARK || t === PT.EMBER || t === PT.ESPARK) { if ((i & 7) === 0) { out.push({ x: this.x[i], y: this.y[i], r: 0.6, col: t === PT.ESPARK ? [140, 210, 255] : [255, 200, 120], intensity: 0.5 }); cnt++; } }
    }
  },
};
function pointFixture(x, y) {
  let hit = null;
  const p = V(x, y);
  Phys.world.queryAABB(pl.AABB(V(x - 0.005, y - 0.005), V(x + 0.005, y + 0.005)), (f) => {
    if (f.isSensor()) return true;
    if (f.testPoint(p)) { hit = f; return false; }
    return true;
  });
  return hit;
}

/* -------------------------------------------------------------------------
   MANCHAS EN EL TERRENO (por trozos de lienzo en resolución de sprite)
   ------------------------------------------------------------------------- */
const Decals = {
  CH: 256, chunks: new Map(),
  key(cx, cy) { return cx + ',' + cy; },
  chunk(cx, cy, create) {
    const k = this.key(cx, cy);
    let c = this.chunks.get(k);
    if (!c && create) {
      const cv = makeCanvas(this.CH, this.CH);
      c = { cx, cy, cv, ctx: cv.getContext('2d') };
      this.chunks.set(k, c);
    }
    return c;
  },
  pixel(gx, gy, col, alpha = 1) {
    const cx = Math.floor(gx / this.CH), cy = Math.floor(gy / this.CH);
    const c = this.chunk(cx, cy, true);
    c.ctx.globalAlpha = alpha;
    c.ctx.fillStyle = rgbStr(col, 1);
    c.ctx.fillRect(gx - cx * this.CH, gy - cy * this.CH, 1, 1);
    c.ctx.globalAlpha = 1;
  },
  // pintar si el píxel está dentro del terreno
  paintAt(x, y, col, alpha = 1) {
    const gx = Math.floor(x / PX), gy = Math.floor(y / PX);
    const wx = (gx + 0.5) * PX, wy = (gy + 0.5) * PX;
    if (!World.insideTerrain(wx, wy)) return false;
    this.pixel(gx, gy, col, alpha);
    return true;
  },
  splat(x0, y0, x1, y1, col, size, speed, acid) {
    // busca el primer píxel sólido en la trayectoria
    const n = 4;
    let hx = x1, hy = y1;
    for (let k = 0; k <= n; k++) {
      const t = k / n, x = lerp(x0, x1, t), y = lerp(y0, y1, t);
      if (World.insideTerrain(x, y)) { hx = x; hy = y; break; }
    }
    if (acid) col = [90, 120, 40, 255];
    const a = acid ? 0.5 : 0.85;
    this.paintAt(hx, hy, col, a);
    // charco: se extiende horizontalmente sobre superficies
    const spread = Math.min(4, Math.floor(speed / 3)) + (size > 1 ? 2 : 0);
    for (let s = 1; s <= spread; s++) {
      if (Math.random() < 0.6) this.paintAt(hx + s * PX * (Math.random() < 0.5 ? -1 : 1), hy, shadeRgb(col, rand(0.85, 1.05)), a * 0.9);
    }
    if (size > 1) for (let k = 0; k < 3; k++) this.paintAt(hx + gauss() * PX * 2, hy + Math.abs(gauss()) * PX, col, a);
  },
  scorch(x, y, r) {
    // busca la superficie bajo cada columna y la oscurece unos píxeles
    const step = PX;
    for (let gx = x - r; gx <= x + r; gx += step) {
      const dx = Math.abs(gx - x) / r;
      let sy = null;
      for (let gy = y - r; gy <= y + r; gy += step) { if (World.insideTerrain(gx, gy)) { sy = gy; break; } }
      if (sy === null) continue;
      const dd = Math.hypot(gx - x, sy - y) / r; if (dd > 1) continue;
      const depth = Math.max(1, Math.round((1 - dd) * 5));
      for (let k = 0; k < depth; k++) {
        if (Math.random() < 0.15 * dd) continue;
        this.paintAt(gx, sy + k * step, [20, 18, 16], (0.75 - k * 0.12) * (1 - dd * 0.7));
      }
    }
  },
  hole(x, y) { this.paintAt(x, y, [25, 24, 22], 0.9); this.paintAt(x + PX, y, [60, 58, 55], 0.5); },
  draw(ctx, cam) {
    const v = cam.bounds(0);
    const size = this.CH * PX;
    ctx.imageSmoothingEnabled = false;
    for (const c of this.chunks.values()) {
      const x = c.cx * size, y = c.cy * size;
      if (x > v[2] || x + size < v[0] || y > v[3] || y + size < v[1]) continue;
      ctx.drawImage(c.cv, x, y, size, size);
    }
  },
  clear() { this.chunks.clear(); },
  clearThings() {},
};

// Definición de extremidades (vista de perfil mirando a la derecha, y hacia abajo)

    L.paint(csx, csy, 2.6, (i, dd) => { L.dmg[i] = Math.max(L.dmg[i], dd < 0.45 ? 0.95 : 0.7); });
    const psx = d.jx - P.def.cx + P.tpl.w / 2, psy = d.jy - P.def.cy + P.tpl.h / 2;
    P.paint(psx, psy, 2.6, (i, dd) => { P.dmg[i] = Math.max(P.dmg[i], dd < 0.45 ? 0.95 : 0.7); });
    this.addWound(L, csx, csy, 0.012, true);
    this.addWound(P, psx, psy, L.id === 'head' ? 0.03 : 0.018, true);
    if (this.bleedKind) Effects.blood(wp.x, wp.y, 0, -1.5, 30, 2.5, this.bleedKind);
    else Effects.debris(wp.x, wp.y, 0, -1, 8, this.kind === 'dummy' ? [230, 200, 60] : [220, 215, 200]);
    if (this.kind === 'android') Effects.sparks(wp.x, wp.y, 0, 0, 14, 3);
    Sound.play('gore', wp.x, wp.y, 0.9);
    if (this.alive) this.pain += 0.8 * this.painMul;
    this.updateConnectivity();
  }
  gib(L, dx = 0, dy = 0) {
    if (L.destroyed) return;

    const p = L.body.getPosition();
    if (L.joint) this.sever(L, 'gib');
    for (const c of L.children) if (c.joint) this.sever(c, 'gib');
    L.destroyed = true;
    L.wounds.length = 0;
    const big = L.def.mass >= 5 ? 1.5 : 1;
    Effects.gore(p.x, p.y, Math.round(16 * big), 5, this.kind === 'android' ? 'robot' : this.kind === 'dummy' ? 'dummy' : this.bleedKind ? 'flesh' : 'dummy', dx, dy);
    Sound.play('gore', p.x, p.y, 1.2);
    const b = L.body;
    const pi = this.parts.indexOf(L.part); if (pi >= 0) this.parts.splice(pi, 1);
    Phys.later(() => {
      Stuck.releaseBody(b); Holding.releaseBody(b); Connections.removeBody(b);
      if (Input.drag && Input.drag.body === b) Input.endDrag();
      const bi = this.bodies.indexOf(b); if (bi >= 0) this.bodies.splice(bi, 1);
      try { Phys.world.destroyBody(b); } catch (e) {}

  updateConnectivity() {
    for (const L of this.limbList) L.connected = false;

    if (!this.root.destroyed) visit(this.root);
    // si la cabeza no está conectada, todo muere
    if (!this.limbs.head.connected && this.alive) this.die('Decapitado');
  }
  // ---- muerte / curación ----
  die(reason) {
    if (!this.alive || this.immortal) return;
    this.alive = false; this.consc = 0; this.deathReason = reason;
    this.dropHeld(true);
    this.markDirty();
  }
  heal(full = true) {
    for (const L of this.limbList) {
      if (L.destroyed) continue;
      L.health = 1; L.boneHealth = 1; L.broken = false; L.wounds.length = 0; L.integrity = 1;
      L.dmg.fill(0); L.bruise.fill(0); L.burnMap.fill(0); L.hole.fill(0); if (full) L.bloodMap.fill(0); L.frost = 0;
      // conservar muñones
      if (L.severed) { const d = L.def; L.paint(d.jx - d.cx + L.tpl.w / 2, d.jy - d.cy + L.tpl.h / 2, 1.8, (i) => { L.dmg[i] = 0.7; }); }
      for (const c of L.children) if (c.severed || c.destroyed) { const d = c.def; L.paint(d.jx - L.def.cx + L.tpl.w / 2, d.jy - L.def.cy + L.tpl.h / 2, 1.8, (i) => { L.dmg[i] = 0.7; }); }
      L.dirty = true;
    }
    this.blood = 1; this.pain = 0; this.brain = 1; this.heart = 1; this.knock = 0; this.shock = 0; this.poison = 0; this.acid = 0; this.pale = 0;

    Sound.play('heal', p.x, p.y, 0.8);
  }
  becomeZombie() {
    if (this.kind === 'android' || this.limbs.head.destroyed || !this.limbs.head.connected) return;
    this.zombie = true; this.kind = 'zombie';
    const zp = humanPalette('zombie');
    for (const L of this.limbList) {
      const nt = buildLimbTemplate(L.def.tpl, Object.assign({}, this.pal, { S: zp.S, s: zp.s, L: zp.L, E: zp.E, R: zp.s }), 'zombie');
      L.tpl = nt; L.dirty = true;
    }
    this.alive = true; this.consc = 1; this.brain = Math.max(this.brain, 0.4); this.heart = 1; this.blood = Math.max(this.blood, 0.6); this.pain = 0; this.painMul = 0.1; this.pale = 0.3; this.lowBloodT = 0;
    for (const L of this.limbList) { L.broken = false; L.boneHealth = Math.max(L.boneHealth, 0.6); }
    this.setState('lying'); this.getupWait = 1;
    this.name = 'Zombi';
    const p = this.root.body.getPosition();
    Sound.play('bite', p.x, p.y, 0.8, { pitch: 0.5 });
  }
  // ---- congelación (jeringa criogénica) ----
  freezeSolid() {
    this.frozenSolid = true; this.die('Congelado');
    for (const L of this.limbList) { L.frost = 1; L.dirty = true; }
    for (const L of this.limbList) if (L.joint) { L.joint.enableMotor(true); L.joint.setMotorSpeed(0); L.joint.setMaxMotorTorque(50000); }
    for (const b of this.bodies) for (let f = b.getFixtureList(); f; f = f.getNext()) { f.setFriction(0.1); const d = f.getUserData(); d.mat = 'ice'; }
  }
  unfreezeSolid() {
    this.frozenSolid = false;
    for (const L of this.limbList) { L.frost = 0; L.dirty = true; }
    for (const b of this.bodies) for (let f = b.getFixtureList(); f; f = f.getNext()) { const d = f.getUserData(); d.mat = this.mat; f.setFriction(MATERIALS[this.mat].friction); }
  }
  // ------------------------------------------------------------------
  // INTERACCIONES
  // ------------------------------------------------------------------
  onImpact(im, body, fix, obody, ofix, dv, sgnN) {
    const L = this.limbOfBody(body);
    if (!L || L.destroyed) return;
    const od = ofix.getUserData() || {};
    if (od.thing === this) return;
    // umbral de daño contundente
    const robot = this.kind === 'android';
    const k = robot ? 0.6 : 1;
    if (dv > 6) {
      const amt = Math.pow((dv - 6) / 16, 1.5) * k;
      if (amt > 0.01) {
        this.hurt(L, Math.min(amt, 2), dv > 40 && Settings.gore ? 'crush' : 'blunt', im.x, im.y);
        if (L.id === 'head' && dv > 10 && this.alive) this.knock = Math.max(this.knock, (dv - 10) * 0.6);
        if (dv > 7 && this.bleedKind && this.alive) Effects.blood(im.x, im.y, -im.nx * sgnN * 1.5, -im.ny * sgnN * 1.5, Math.floor(dv / 4), 1.2, this.bleedKind);
      }
      if (dv > 10 && this.state === 'stand') this.setState('lying');
    }
    if (dv > 2.5 && this.alive) this.fear = Math.max(this.fear, 0.2);
  }
  // impacto de bala: devuelve energía restante
  bulletHit(f, x, y, dx, dy, energy, exitX, exitY, o = {}) {
    const L = f.getUserData().part;
    if (!L || L.destroyed) return 0;
    const res = MATERIALS[this.mat].bulletRes * (L.id === 'upperBody' || L.id === 'lowerBody' ? 1.3 : L.id === 'head' ? 1.1 : 1) * (this.frozenSolid ? 3 : 1);
    // a quemarropa (escopeta, calibres grandes) la parte golpeada revienta
    const close = o.closeGib ? clamp(1 - (o.dist || 99) / o.closeGib, 0, 1) : 0;
    const dmg = Math.min(energy, 6) * 0.2 * (1 + close * 5);
    this.hurt(L, dmg, 'bullet', x, y, dx, dy, { power: energy });
    if (close > 0.15 && Settings.gore && !this.immortal && this.kind !== 'skeleton') {
      L.blastAcc = (L.blastAcc || 0) + close * energy;
      if (L.health <= 0 || L.blastAcc > 1.35) {
        L.body.applyLinearImpulse(V(dx * energy * 3, dy * energy * 3), V(x, y), true);
        this.gib(L, dx, dy);
        return energy * 0.6;
      }
    }
    // impulso
    L.body.applyLinearImpulse(V(dx * energy * 2.2, dy * energy * 2.2), V(x, y), true);
    if (this.bleedKind === 'blood') Effects.blood(x, y, -dx * 2, -dy * 2, 5, 1.2, 'blood');
    if (this.kind === 'android') Effects.sparks(x, y, -dx * 2, -dy * 2, 6, 3);
    if (this.kind === 'dummy') Effects.debris(x, y, -dx, -dy, 4, [230, 200, 60]);
    const rem = energy - res;
    if (rem > 0 && exitX !== undefined) {
      this.hurt(L, dmg * 0.4, 'bullet', exitX, exitY, dx, dy, { exit: true, power: rem });
      if (this.bleedKind) Effects.blood(exitX, exitY, dx * 4, dy * 4, 8, 1.6, this.bleedKind);
    }
    if (this.alive && L.id === 'head') this.knock = Math.max(this.knock, 3);
    if (this.state === 'stand' && energy > 1.2) this.setState('lying');
    if (this.alive && energy > 0.8 && Math.random() < 0.25 && this.state === 'stand') this.setState('lying');
    Sound.play('impact_flesh', x, y, 0.7, { pitch: 1.3 });
    return rem;
  }
  stainAt(f, x, y, col) {
    const L = f.getUserData().part;
    if (!L || L.destroyed) return;
    const lp = L.localPx(x, y), p = L.nearestPx(lp[0], lp[1]);
    if (!p) return;
    const i = p[1] * L.tpl.w + p[0];
    L.bloodMap[i] = Math.min(1, L.bloodMap[i] + 0.5);
    L.dirty = true;
  }
  burnHit(f, x, y, amt) { const L = f.getUserData().part; if (L) this.hurt(L, amt, 'burn', x, y); }
  acidHit(f, x, y) { const L = f.getUserData().part; if (L) this.hurt(L, 0.03, 'acid', x, y); }
  shockHit(L, power, x, y) {
    if (!L || L.destroyed) return;
    this.shock = Math.max(this.shock, 0.35 + power * 0.6);
    this.hurt(L, 0.04 * power, 'shock', x, y);
    if (this.kind === 'android') { this.shock = Math.max(this.shock, 1.5 * power); Effects.sparks(x, y, 0, 0, 6, 3, 'blue'); }
    if (this.alive && power > 2.5 && Math.random() < 0.15 * power && !this.immortal) this.heart -= 0.4;
  }
  igniteAt(f, power) { this.ignite(power); }
  ignite(power = 1) {
    if (this.kind === 'android' || this.frozenSolid) return false;
    if (this.fire <= 0) { this.fire = 0.2 * power; this.fuel = 22; const p = this.root.body.getPosition(); Sound.play('ignite', p.x, p.y, 0.6); }
    return true;
  }
  updateHumanFire(dt) {
    this.fire = Math.min(1, this.fire + dt * 0.4);
    this.fuel -= dt;
    for (const L of this.limbList) {
      if (L.destroyed) continue;
      if (Math.random() < this.fire * 0.55) { const op = L.spr.opaque(); const q = op[(Math.random() * op.length) | 0]; if (q) { const w = L.worldPt(q[0] + Math.random(), q[1] + Math.random()); Effects.fire(w[0], w[1], this.fire * 0.9); } }
      if (Math.random() < dt * 4 * this.fire) {
        const sx = rand(L.tpl.w), sy = rand(L.tpl.h);
        L.paint(sx, sy, 1.5, (i) => { L.burnMap[i] = Math.min(1, L.burnMap[i] + 0.3); });
        if (!this.immortal) L.health = Math.max(0, L.health - 0.012);
      }
    }
    if (this.alive) { this.pain += dt * 0.25 * this.fire * this.painMul; this.fear = 1; if (!this.immortal) this.heart -= dt * 0.006 * this.fire; }
    if (Math.random() < dt * 5) Sound.play('crackle', this.root.body.getPosition().x, this.root.body.getPosition().y, 0.7);
    if (Math.random() < dt * 3) spreadFire(this);
    if (this.fuel <= 0) this.fire = 0;
  }
  extinguish() { if (this.fire > 0) { this.fire = 0; const p = this.root.body.getPosition(); Effects.smoke(p.x, p.y, 8); } }
  // explosión
  blast(L, power, dx, dy, d) {
    const amt = power;
    this.hurt(L, amt, 'explosion', L.body.getPosition().x, L.body.getPosition().y, dx, dy);
    if (Settings.gore && amt > 1.6 && Math.random() < 0.5) this.gib(L);
    else if (Settings.gore && amt > 0.9 && L.joint && Math.random() < 0.35) this.sever(L, 'blast');
    if (this.alive) { this.knock = Math.max(this.knock, amt * 4); this.fear = 1; }
    if (this.state === 'stand' && amt > 0.1) this.setState('lying');
  }
  // ---- sostener objetos ----
  handPoint(side) {
    const L = this.limbs['lowerArm' + side];
    return L.worldPt(2, L.tpl.h - 2.5);
  }
  dropHeld(force) {
    if (!force) return;
    for (const s of ['F', 'B']) if (this.held[s]) Holding.release(this.held[s]);
  }
  // ---- girar (espejo) ----
  flipFacing() {
    if (this.frozenSolid) return;
    this.dropHeld(true);
    Stuck.removeThing(this);
    const cx = this.limbs.lowerBody.body.getPosition().x;
    for (const L of this.limbList) if (L.joint) { const j = L.joint; L.joint = null; try { Phys.world.destroyJoint(j); } catch (e) {} }
    this.joints = [];
    for (const L of this.limbList) {
      if (L.destroyed) continue;
      const b = L.body, p = b.getPosition(), v = b.getLinearVelocity();
      b.setTransform(V(2 * cx - p.x, p.y), -b.getAngle());

    }

    for (const L of this.limbList) { L.part.flip = this.facing < 0; }

  }
  // ---- IA zombi ----
  zombieAI(dt) {
    this.aiT = (this.aiT || 0) - dt;
    if (this.aiT <= 0) {
      this.aiT = 0.8;
      let best = null, bd = 30;
      const p = this.root.body.getPosition();
      for (const t of World.things) {
        if (!t.isHuman || t === this || t.zombie || !t.alive || t.dead) continue;
        const q = t.root.body.getPosition(); const d = Math.hypot(q.x - p.x, q.y - p.y);
        if (d < bd) { bd = d; best = t; }
      }
      this.target = best;
    }
    this.walking = false;
    if (!this.target || this.target.dead || !this.target.alive) return;
    const p = this.root.body.getPosition(), q = this.target.root.body.getPosition();
    const dx = q.x - p.x;
    if (this.state === 'stand' && Math.sign(dx) !== this.facing && Math.abs(dx) > 0.4 && (!this._flipT || this.t - this._flipT > 2)) { this._flipT = this.t; this.flipFacing(); return; }
    if (this.state === 'stand' && Math.abs(dx) > 0.45) { this.walking = true; this.walkDir = Math.sign(dx); }
    // morder
    this.biteT -= dt;
    if (this.biteT <= 0) {
      const head = this.limbs.head;
      if (head.destroyed) return;
      const hp = head.body.getPosition();
      const hands = ['F', 'B'].map((s) => this.limbs['lowerArm' + s]).filter((l) => !l.destroyed).map((l) => l.worldPt(2, l.tpl.h - 2));
      let hit = null, hd = 0.5;
      for (const L of this.target.limbList) {
        if (L.destroyed) continue;
        const lp = L.body.getPosition();
        for (const h of [[hp.x, hp.y], ...hands]) { const d = Math.hypot(lp.x - h[0], lp.y - h[1]); if (d < hd) { hd = d; hit = L; } }
      }
      if (hit) {
        this.biteT = 1.1;
        const lp = hit.body.getPosition();
        this.target.hurt(hit, 0.12, 'bite', lp.x + rand(-0.03, 0.03), lp.y + rand(-0.05, 0.05));
        if (this.target.zombieT <= 0 && this.target.kind === 'human') this.target.zombieT = rand(12, 20);
        Sound.play('bite', lp.x, lp.y, 0.9);
        hit.body.applyLinearImpulse(V(this.facing * 6, -2), lp, true);
      }
    }
  }
  // ------------------------------------------------------------------
  info() {
    const lines = [];
    if (this.kind === 'dummy' || this.kind === 'skeleton') { lines.push(['Objeto inerte', '#9aa3ad']); return lines; }
    if (this.alive) {
      const st = this.consc < 0.35 ? ['Inconsciente', '#e0b34f'] : this.zombie ? ['Zombi activo', '#9fd36b'] : this.shock > 0 ? ['Electrocutado', '#7fd3ff'] : this.pain * this.painMul > 0.6 ? ['Con dolor', '#ffb070'] : ['Consciente', '#7ad48a'];
      lines.push(st);
    } else lines.push(['Muerto' + (this.deathReason ? ' (' + this.deathReason + ')' : ''), '#e05a4f']);
    if (this.bleedKind === 'blood') lines.push([`Sangre: ${Math.round(this.blood * 100)}%`, this.blood < 0.6 ? '#e05a4f' : '#cfd5dc']);
    const broken = this.limbList.filter((l) => l.broken && !l.destroyed).length;
    if (broken) lines.push([`Huesos rotos: ${broken}`, '#e0b34f']);
    const lost = this.limbList.filter((l) => l.severed || l.destroyed).length;
    if (lost) lines.push([`Extremidades perdidas: ${lost}`, '#e05a4f']);
    if (this.fire > 0) lines.push(['En llamas', '#ff8a3c']);
    if (this.zombieT > 0 && !this.zombie && this.alive) lines.push(['Infectado', '#9fd36b']);
    if (this.immortal) lines.push(['Inmortal', '#f0b23c']);
    return lines;
  }
  menu(limb) {
    const m = [];
    if (this.alive) {
      m.push({ label: 'Matar', fn: () => { this.brain = 0; this.die('Asesinado'); } });
      m.push({ label: 'Dejar inconsciente', fn: () => { this.knock = 10; } });
    }
    m.push({ label: this.alive ? 'Curar' : 'Revivir', fn: () => this.heal() });
    m.push({ label: this.immortal ? 'Quitar inmortalidad' : 'Hacer inmortal', fn: () => { this.immortal = !this.immortal; if (this.immortal) this.heal(); } });
    if (limb && !limb.destroyed) {
      if (limb.joint) m.push({ label: `Arrancar: ${limb.def.name}`, fn: () => this.sever(limb, 'manual') });
      if (!limb.broken && this.kind !== 'android') m.push({ label: `Romper hueso: ${limb.def.name}`, fn: () => this.breakBone(limb) });
    }
    m.push({ label: 'Electrocutar', fn: () => { const p = this.root.body.getPosition(); this.shockHit(this.root, 2, p.x, p.y); Effects.bolt(p.x, p.y - 3, p.x, p.y); Sound.play('zap', p.x, p.y); } });
    if (this.held.F || this.held.B) m.push({ label: 'Soltar objeto', fn: () => this.dropHeld(true) });
    if (this.alive && this.kind !== 'android') m.push({ label: 'Infectar (zombi)', fn: () => { this.zombieT = 6; } });
    if (!this.frozenSolid) m.push({ label: 'Voltear', fn: () => this.flipFacing() });
    return m;
  }
}

/* =========================================================================
   SISTEMAS: apuñalar, sostener, conexiones, activación, explosiones, balas
   ========================================================================= */
const _sliceMemo = new Map();
function trySharp(contact, fS, fO, dS, dO) {
  const bS = fS.getBody(), bO = fO.getBody();
  if (bS._nc && bS._nc.has(bO)) { contact.setEnabled(false); return true; }
  const item = dS.thing;
  if (!item || item.dead || dO.thing === item) return false;
  const sh = dS.sharp;
  const wm = contact.getWorldManifold(null);
  if (!wm || !wm.points.length) return false;
  const p = wm.points[0];
  const vS = bS.getLinearVelocityFromWorldPoint(p), vO = bO.getLinearVelocityFromWorldPoint(p);
  const rvx = vS.x - vO.x, rvy = vS.y - vO.y;
  const mo = MATERIALS[dO.mat];
  const isLimb = dO.thing && dO.thing.isHuman;
  // cortadores (sierras, espada de energía, motosierra)
  if (sh.cutter) {
    if (!item.on && !sh.alwaysOn) return false;
    if (!mo || !(isLimb || dO.mat === 'wood' || dO.mat === 'fruit' || dO.mat === 'foam' || dO.mat === 'plastic')) return false;
    const key = bS.__id + ':' + (bO.__id || (bO.__id = uid()));
    const now = Phys.time;
    if (!_sliceMemo.has(key) || now - _sliceMemo.get(key) > (sh.rate || 0.12)) {
      _sliceMemo.set(key, now);
      Phys.later(() => cutterHit(item, sh, fO, p.x, p.y, rvx, rvy));
    }
    if (sh.passThrough && isLimb) { contact.setEnabled(false); return true; }
    return false;
  }
  if (!mo || !mo.stab) return false;
  const tip = bS.getWorldPoint(sh.tip), dir = bS.getWorldVector(sh.dir);
  const dTip = Math.hypot(p.x - tip.x, p.y - tip.y);
  if (dTip < sh.tipR) {
    const along = rvx * dir.x + rvy * dir.y;
    const sp = Math.hypot(rvx, rvy);
    const minS = Math.max(sh.min || 3, mo.stabMin || 0) * (isLimb ? 1 : 1.2);
    if (along > minS && along > sp * 0.72) {
      if (!bS.__id) bS.__id = uid();
      contact.setEnabled(false);
      setNoCollideRaw(bS, bO);
      const tx = tip.x, ty = tip.y, dx = dir.x, dy = dir.y;
      Phys.later(() => Stuck.create(item, bS, fO, tx, ty, dx, dy, along, sh));
      return true;
    }
  }
  // filo (cortes)

/* -------------------------------------------------------------------------
   OBJETOS SOSTENIDOS POR HUMANOS
   ------------------------------------------------------------------------- */
const Holding = {
  map: new Map(),
  tryGrab(item) {
    if (!item.def.grip || item.dead || this.map.has(item) || item.frozen) return false;
    const gp = item.gripWorld();
    let best = null, bd = 0.28;
    for (const t of World.things) {
      if (!t.isHuman || t.dead || !t.alive || t.consc < 0.5 || t.zombie) continue;
      for (const s of ['F', 'B']) {
        if (t.held[s]) continue;
        const L = t.limbs['lowerArm' + s];
        if (L.destroyed || !L.connected || L.broken) continue;
        const hp = t.handPoint(s);
        const d = Math.hypot(hp[0] - gp[0], hp[1] - gp[1]);
        if (d < bd) { bd = d; best = { t, s }; }

    }
    if (!best) return false;
    this.attach(item, best.t, best.s);
    return true;
  },
  attach(item, h, side) {
    const L = h.limbs['lowerArm' + side];
    const a = L.body.getAngle();
    if (item.flip !== (h.facing < 0)) item.setFlip(h.facing < 0);
    const b = a + h.facing * Math.PI / 2;
    const hp = h.handPoint(side);
    const gl = item.gripLocal();
    const r = rot(gl[0], gl[1], b);
    const body = item.main;
    body.setTransform(V(hp[0] - r[0], hp[1] - r[1]), b);
    body.setLinearVelocity(L.body.getLinearVelocity()); body.setAngularVelocity(0);
    for (const ib of item.bodies) for (const lb of h.bodies) setNoCollide(ib, lb, true);
    const j = Phys.world.createJoint(pl.WeldJoint({ frequencyHz: 0, dampingRatio: 0 }, L.body, body, V(hp[0], hp[1])));
    h.held[side] = item; item.holder = h;
    this.map.set(item, { h, side, j });
    Sound.play('click', hp[0], hp[1], 0.6);
  },
  release(item) {
    const r = this.map.get(item); if (!r) return;
    this.map.delete(item);
    try { Phys.world.destroyJoint(r.j); } catch (e) {}
    r.h.held[r.side] = null; item.holder = null;

  },
  removeThing(t) {

  },
  releaseBody(b) { for (const [item, r] of [...this.map]) if (item.ownsBody(b) || r.h.limbs['lowerArm' + r.side].body === b) this.release(item); },

/* -------------------------------------------------------------------------
   CONEXIONES (herramientas: soldar, bisagra, resorte, cuerda...)
   ------------------------------------------------------------------------- */
const CONN_TYPES = {
  weld: { name: 'Soldadura', col: '#9aa3ad' },
  hinge: { name: 'Bisagra', col: '#c9ced4' },
  spring: { name: 'Resorte', col: '#d9d2c2' },
  rope: { name: 'Cuerda', col: '#a07a4a' },
  rod: { name: 'Barra rígida', col: '#8a9099' },
  elastic: { name: 'Elástico', col: '#c94a3a' },
  wire: { name: 'Cable de activación', col: '#7ad48a' },
  motor: { name: 'Motor', col: '#f0b23c' },

  list: [],

      c.joint = w.createJoint(pl.DistanceJoint({ frequencyHz: 0, dampingRatio: 0, collideConnected: true }, A, B, V(pA[0], pA[1]), V(pB[0], pB[1])));
    } else if (type === 'rope') {

  },
  remove(c) {

  removeThing(t) { for (const c of [...t.conns]) this.remove(c); },

  },

  update(dt) {

  near(x, y, r) {

    }
  },

/* -------------------------------------------------------------------------
   ACTIVACIÓN (tecla F y cables)
   ------------------------------------------------------------------------- */
function activateThing(t, src, visited) {
  visited = visited || new Set();
  if (!t || t.dead || visited.has(t)) return;
  visited.add(t);
  if (t.isHuman) { for (const s of ['F', 'B']) if (t.held[s]) activateThing(t.held[s], t, visited); }
  else t.activate(src);
  for (const o of t.links) activateThing(o, t, visited);
}

/* -------------------------------------------------------------------------
   EXPLOSIONES
   ------------------------------------------------------------------------- */
function explode(x, y, power, o = {}) {
  const R = 1.9 * Math.sqrt(power) * (o.radiusMul || 1);
  const nuke = power >= 20;
  // efectos visuales
  Effects.flash(x, y, R * 1.6, nuke ? [255, 240, 200] : [255, 190, 110], nuke ? 1.2 : 0.22, 1);
  Effects.wave(x, y, R * 2.2, nuke ? 1.4 : 0.4);
  if (power >= 1.2 && !nuke) Effects.fireball(x, y, R * 0.5, 0.28 + Math.min(0.4, power * 0.03), -0.6);
  const nf = Math.min(260, 40 + power * 22);
  for (let i = 0; i < nf; i++) {
    const a = rand(TAU), s = Math.sqrt(Math.random()) * R * 3.4;
    Effects.add(PT.FIRE, x + Math.cos(a) * 0.1, y + Math.sin(a) * 0.1, Math.cos(a) * s, Math.sin(a) * s - 0.8, rand(0.18, 0.55), rand(2.2, 5.5), pick([[255, 240, 160], [255, 200, 90], [255, 150, 50], [255, 110, 40]]));
  }
  Effects.smoke(x, y, Math.min(80, 14 + power * 9), [70, 68, 66], R * 0.9, Math.min(2.6, 0.8 + power * 0.15));
  Effects.sparks(x, y, 0, -2, Math.min(80, 12 + power * 6), R * 4);
  Effects.debris(x, y, 0, -4, Math.min(60, 8 + power * 4), [70, 66, 60], 1.3);
  if (nuke) {
    Effects.fireball(x, y - 1, R * 0.85, 3.2, -3);
    Effects.fireball(x, y - 0.3, R * 0.55, 2, -1);
    Effects.emitter((e) => {

      if (Math.random() < 0.6) for (let k = 0; k < 3; k++) { const yy = lerp(y, topY, Math.random()); Effects.add(PT.SMOKE, x + gauss() * (0.5 + (y - yy) * 0.04), yy, gauss() * 0.3, -rand(0.3, 1.5), rand(3, 6), rand(28, 55), shadeRgb([118, 96, 82], rand(0.7, 1.1))); }
      if (Math.random() < 0.6) for (let k = 0; k < 4; k++) { const a = rand(TAU); Effects.add(PT.SMOKE, x + Math.cos(a) * rand(0, 2.5), topY + Math.sin(a) * rand(0, 1.3), Math.cos(a) * rand(1, 4.5), Math.sin(a) * rand(0.2, 1.4) - 0.6, rand(4, 8), rand(55, 110), shadeRgb([138, 108, 88], rand(0.7, 1.15))); }

    UI.whiteFlash(1.4);

    const p = t.root.body.getPosition();

/* -------------------------------------------------------------------------
   BALAS (rayos con penetración)
   ------------------------------------------------------------------------- */
function exitPoint(f, x, y, dx, dy) {

}
function fireBullet(x, y, dx, dy, o = {}) {
  const range = o.range || 160;
  const hits = rayAll(x, y, x + dx * range, y + dy * range);
  let energy = o.energy || 1;
  let ex = x + dx * range, ey = y + dy * range;
  const ign = o.ignore;
  for (const h of hits) {
    if (h.f.isSensor()) continue;
    const t = h.d.thing;
    if (t && (t === o.src || (ign && ign.has(t)))) continue;
    if (!t || t.isTerrain) {
      ex = h.x; ey = h.y;
      Effects.dust(h.x, h.y, 3, [140, 138, 134]);
      Effects.sparks(h.x, h.y, h.nx * 2, h.ny * 2, 3, 2);
      Decals.hole(h.x - h.nx * PX * 0.5, h.y - h.ny * PX * 0.5);
      if (!o.quiet) Sound.play('impact_stone', h.x, h.y, 0.4, { pitch: 1.5 });
      energy = 0; break;
    }
    if (o.onHit) o.onHit(t, h);
    if (t.isHuman) {
      const ep = exitPoint(h.f, h.x, h.y, dx, dy);
      energy = t.bulletHit(h.f, h.x, h.y, dx, dy, energy, ep[0], ep[1], { dist: Math.hypot(h.x - x, h.y - y), closeGib: o.closeGib });
      if (o.burn) t.hurt(h.d.part, 0.1, 'burn', h.x, h.y);
    } else if (t.bulletHit) {
      energy = t.bulletHit(h.f, h.x, h.y, dx, dy, energy, h);
    } else energy = genericBulletHit(t, h, dx, dy, energy);
    if (energy <= 0.02) { ex = h.x; ey = h.y; break; }
  }

}

  impactFx(h.d.mat, h.x, h.y, -dx, -dy, energy);

}

  const m = MATERIALS[mat] || MATERIALS.metal;

    case 'spark': Effects.sparks(x, y, nx * 2, ny * 2, 6, 3); Sound.play('impact_metal', x, y, 0.5, { pitch: 1.4 }); break;
    case 'wood': Effects.debris(x, y, nx * 2, ny * 2, 5, [150, 110, 70]); Sound.play('impact_wood', x, y, 0.6); break;
    case 'glass': Effects.glass(x, y, 5, 2); Sound.play('impact_glass', x, y, 0.6); break;
    case 'juice': Effects.blood(x, y, nx * 2, ny * 2, 10, 2, 'juice'); Sound.play('impact_flesh', x, y, 0.6); break;
    case 'blood': Effects.blood(x, y, nx * 2, ny * 2, 6, 1.5); break;

/* -------------------------------------------------------------------------
   RAYO (herramienta divina)
   ------------------------------------------------------------------------- */
function lightningStrike(x, y) {
  const top = Cam.bounds(0)[1] - 2;
  const h = rayFirst(x, top, x, y + 50, (f) => !f.isSensor());
  const hx = h ? h.x : x, hy = h ? h.y : y + 50;
  for (let k = 0; k < 3; k++) Effects.bolt(x + gauss() * 0.4, top, hx, hy, [190, 220, 255], 0.35, 2.4 - k * 0.6, 1.3);
  Effects.flash(hx, hy, 4, [180, 210, 255], 0.3, 1);
  Effects.sparks(hx, hy, 0, -3, 30, 6, 'blue');
  UI.whiteFlash(0.25);
  Sound.play('thunder', hx, hy, 1.1);
  Cam.addShake(0.6);
  if (h) {
    const t = h.d.thing;
    if (t && t.isHuman) {
      t.shockHit(h.d.part, 6, hx, hy);
      if (!t.immortal) { t.heart -= 0.8; for (const L of t.limbList) if (!L.destroyed) t.hurt(L, 0.15, 'burn', L.body.getPosition().x, L.body.getPosition().y, 0, 0, { r: 3 }); }

class Item extends Thing {

/* -------------------------------------------------------------------------
   FÁBRICAS DE COMPORTAMIENTO
   ------------------------------------------------------------------------- */
// ARMAS DE FUEGO
function gunBehavior(g) {
  return {
    gun: g, holdUse: !!g.auto,
    activate(it) { if (!g.auto) shootGun(it, g); },
    onUse(it, on) { if (on && g.spin) it.vars.spinT = it.vars.spinT || 0; if (on && !g.spin) { it.vars.cool = 0; } },
    update(it, dt) {
      it.vars.cool = (it.vars.cool || 0) - dt;
      if (g.auto) {
        if (g.spin) {
          it.vars.spin = clamp((it.vars.spin || 0) + (it.using ? dt / g.spin : -dt / g.spin), 0, 1);
          if (!it.vars.loop && it.vars.spin > 0) { it.vars.loop = Sound.loop('spin'); it.loops.push(it.vars.loop); }
          if (it.vars.loop) { const p = it.main.getPosition(); it.vars.loop.set(it.vars.spin * 0.35, p.x, p.y, 0.6 + it.vars.spin); if (it.vars.spin <= 0) { it.vars.loop.stop(); it.vars.loop = null; } }
          it.vars.rotT = (it.vars.rotT || 0) + it.vars.spin * dt * 40;
          if (it.using && it.vars.spin >= 1 && it.vars.cool <= 0) { shootGun(it, g); it.vars.cool += 1 / g.rate; if (it.vars.cool < 0) it.vars.cool = 0; }
        } else if (it.using && it.vars.cool <= 0) { shootGun(it, g); it.vars.cool = 1 / g.rate; }
      }
      if (it.vars.flashT > 0) it.vars.flashT -= dt;
    },
    menu(it) {
