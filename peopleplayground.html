  if (it.holder) ign.add(it.holder);
  const pellets = g.pellets || 1;
  for (let i = 0; i < pellets; i++) {
    const a = Math.atan2(mz.dy, mz.dx) + gauss() * (g.spread || 0.01);
    fireBullet(mz.x, mz.y, Math.cos(a), Math.sin(a), { energy: g.power * rand(0.9, 1.1), range: g.range || 150, src: it, ignore: ign, tracer: g.tracer, tw: g.tw || 1.1, burn: g.burn, closeGib: g.closeGib });
  }
  // retroceso
  const b = it.main;
  const rec = g.recoil || 3;
  b.applyLinearImpulse(V(-mz.dx * rec, -mz.dy * rec), V(mz.x, mz.y), true);
  b.applyAngularImpulse(-(it.flip ? -1 : 1) * rec * 0.06 * (g.climb || 1), true);
  // efectos
  Effects.flash(mz.x + mz.dx * 0.06, mz.y + mz.dy * 0.06, 0.25 + rec * 0.03, [255, 200, 120], 0.05, 0.9);
  it.vars.flashT = 0.05;
  for (let k = 0; k < 3; k++) Effects.smoke(mz.x + mz.dx * 0.05, mz.y + mz.dy * 0.05, 1, [120, 120, 120], 0.3, 0.4);
  if (g.casing !== false) {
    const cp = g.eject ? it.worldPt(g.eject[0], g.eject[1]) : [mz.x - mz.dx * 0.15, mz.y - mz.dy * 0.15];
    const bv = b.getLinearVelocity();
    Effects.casing(cp[0], cp[1], bv.x - mz.dx * rand(0.5, 1.5) + mz.dy * 0, bv.y - rand(2, 3.5), g.pellets > 1);
  }
  Sound.play(g.sound || 'shot_pistol', mz.x, mz.y, 1, { pitch: rand(0.94, 1.06) });
  Cam.addShake(Math.min(0.25, rec * 0.012));
  // asustar a los cercanos
  for (const t of World.things) {
    if (!t.isHuman || !t.alive || t === it.holder) continue;
    const p = t.root.body.getPosition();
    if (Math.hypot(p.x - mz.x, p.y - mz.y) < 4) t.fear = Math.max(t.fear, 0.5);
  }
}

// EXPLOSIVOS
function explosiveBehavior(e) {
  return {
    explosive: e,
    init(it) { it.vars.armed = e.armed || false; it.vars.t = 0; },
    activate(it) {
      if (e.trigger === 'instant') return detonate(it);
      if (!it.vars.lit) { it.vars.lit = true; it.vars.fuse = e.fuse; if (e.onLight) e.onLight(it); Sound.play(e.trigger === 'fuse' ? 'ignite' : 'click', it.pos().x, it.pos().y, 0.7); }
    },
    update(it, dt) {
      it.vars.t += dt;
      if (e.arm && it.vars.t > e.arm) it.vars.armed = true;
      if (it.vars.lit) {
        it.vars.fuse -= dt;
        if (e.trigger === 'fuse') { const p = it.worldPt(e.fusePt[0], e.fusePt[1]); if (Math.random() < 0.8) Effects.sparks(p[0], p[1], 0, -1, 1, 1.5); if (Math.random() < 0.3) Effects.smoke(p[0], p[1], 1, [120, 120, 120], 0.2, 0.3); Effects.light(p[0], p[1], 0.8, [255, 180, 90], 0.6, 0.05); }
        if (e.beep && Math.random() < dt * (e.fuse > 0 ? 3 / Math.max(0.3, it.vars.fuse) : 4)) Sound.play('beep', it.pos().x, it.pos().y, 0.5);
        if (it.vars.fuse <= 0) detonate(it);
      }
      if (e.update) e.update(it, dt);
    },
    onImpact(it, im, dv) {
      if (e.impact && dv > e.impact && (it.vars.armed || !e.arm)) Phys.later(() => detonate(it));
      if (e.sticky && !it.vars.stuckTo && dv > 0.5) Phys.later(() => stickTo(it, im));
    },
    onBlast(it, power) { if (power > (e.chain || 0.4)) { it.vars.lit = true; it.vars.fuse = Math.min(it.vars.fuse || 1, rand(0.05, 0.25)); } },
    bulletHit(it, f, x, y, dx, dy, energy, h) {
      if (e.shootable) { it.vars.lit = true; it.vars.fuse = Math.min(it.vars.fuse === undefined || !it.vars.fuse ? 0.05 : it.vars.fuse, 0.05); }
      return genericBulletHit(it, h || { f, b: f.getBody(), d: f.getUserData(), x, y }, dx, dy, energy);
    },
    onIgnite(it) { if (e.flammable !== false) { it.vars.lit = true; it.vars.fuse = Math.min(it.vars.fuse || 3, rand(1, 3)); } },
    onTouch(it, f, of) {
      if (e.trigger === 'contact' && it.vars.armed) { const o = thingOf(of); if (o && !o.isTerrain && of.getBody().getMass() > 0.4) Phys.later(() => { it.vars.lit = true; it.vars.fuse = 0.12; Sound.play('click', it.pos().x, it.pos().y); }); }
    },
    menu(it) { return [{ label: e.trigger === 'instant' ? 'Detonar' : e.trigger === 'fuse' ? 'Encender mecha' : e.trigger === 'contact' ? 'Detonar ahora' : 'Activar', fn: () => (e.trigger === 'contact' ? detonate(it) : it.activate()) }]; },
    info(it) { return it.vars.lit ? [['¡Activado!', '#ff8a3c']] : e.trigger === 'contact' ? [[it.vars.armed ? 'Armada' : 'Armándose...', '#e0b34f']] : []; },
  };
}
function detonate(it) {
  if (it.dead || it._boom) return;
  it._boom = true;
  const e = it.def.explosive;
  const p = it.main.getWorldCenter();
  const x = p.x, y = p.y;
  it.destroy(true);
  if (e.special) e.special(x, y, it);
  else explode(x, y, e.power, { frag: e.frag, fire: e.fire, src: null });
}
function stickTo(it, im) {
  if (it.dead || it.vars.stuckTo) return;
  const other = im.bA === it.main ? im.bB : im.bA;
  if (!other) return;
  const j = Phys.world.createJoint(pl.WeldJoint({}, other, it.main, V(im.x, im.y)));
  it.joints.push(j); it.vars.stuckTo = other;
  Sound.play('clunk', im.x, im.y, 0.6);
}

// JERINGAS
function syringeBehavior(effect, color) {
  return {
    syringe: { effect, color },
    init(it) { it.vars.full = 1; },
    onStab(it, rec) { if (rec.target.isHuman) it.vars.inj = rec; },
    update(it, dt) {
      const r = it.vars.inj;
      if (r && it.vars.full > 0) {
        if (!Stuck.list.includes(r)) { it.vars.inj = null; return; }
        it.vars.full = Math.max(0, it.vars.full - dt * 3.5);
        if (it.vars.full <= 0) {
          applySyringe(r.target, effect, r.limb);
          const p = it.pos(); Sound.play('syringe', p.x, p.y, 0.8);
          if (it.parts[0]) { it.parts[0].spr = syringeSprite(null); it.parts[0].ownSpr = true; }
        }
      }
    },
    info(it) { return [[it.vars.full > 0 ? 'Llena' : 'Vacía', it.vars.full > 0 ? '#7ad48a' : '#9aa3ad']]; },
    menu(it) { return [{ label: 'Rellenar', fn: () => { it.vars.full = 1; it.vars.inj = null; it.parts[0].spr = defSprite(it.def, false); it.parts[0].ownSpr = false; } }]; },
  };
}
function applySyringe(h, effect, limb) {
  const p = h.root.body.getPosition();
  switch (effect) {
    case 'life': h.heal(true); Effects.sparks(p.x, p.y, 0, -1, 10, 1.5, 'blue'); break;
    case 'adrenaline': h.adren = 1; h.pain = 0; h.knock = 0; h.consc = Math.max(h.consc, 0.8); if (!h.alive && h.heart <= 0 && h.brain > 0.2 && h.blood > 0.35) { h.heart = 0.5; h.alive = true; } break;
    case 'knockout': h.knock = 60; break;
    case 'acid': h.acidT = 12; h.pain += 0.4 * h.painMul; if (!h._acidHook) { h._acidHook = true; const old = h.update.bind(h); h.update = (dt) => { old(dt); if (h.acidT > 0 && !h.dead) { h.acidT -= dt; for (let k = 0; k < 2; k++) { const L = pick(h.limbList.filter((l) => !l.destroyed)); if (!L) break; const q = L.worldPt(rand(L.tpl.w), rand(L.tpl.h)); h.hurt(L, 0.02, 'acid', q[0], q[1]); if (Math.random() < 0.3) Effects.smoke(q[0], q[1], 1, [140, 200, 80], 0.3, 0.3); if (Math.random() < 0.2 && h.bleedKind) Effects.blood(q[0], q[1], 0, 0, 1, 0.3, h.bleedKind); } } }; } break;
    case 'coagulant': h.coag = true; for (const L of h.limbList) L.wounds.length = 0; setTimeout(() => (h.coag = false), 30000); break;
    case 'bone': for (const L of h.limbList) { L.broken = false; L.boneHealth = 1; } break;
    case 'zombie': if (h.kind === 'human') h.zombieT = 5; break;
    case 'poison': h.poison = 40; break;
    case 'strength': h.strengthMul = 5; h.adren = 1; break;
    case 'cryo': h.freezeSolid(); break;
    case 'nitro': h.nitroT = 4; break;
    case 'immortal': h.immortal = true; h.heal(); break;
  }
}

// interruptores genéricos (máquinas)
function toggleBehavior(extra = {}) {
  return Object.assign({
    activate(it) { it.on = !it.on; Sound.play('click', it.pos().x, it.pos().y, 0.6); if (extra.onToggle) extra.onToggle(it); },
    menu(it) { return [{ label: it.on ? 'Apagar' : 'Encender', fn: () => it.activate() }]; },
    info(it) { return [[it.on ? 'Encendido' : 'Apagado', it.on ? '#7ad48a' : '#9aa3ad']]; },
  }, extra);
}

}

/* ----------------------------- LANZADORES ------------------------------ */
function launcherBehavior(o) {
  return {
    gun: true,
    activate(it) {
      if ((it.vars.cool || 0) > 0) { Sound.play('dryfire', it.pos().x, it.pos().y, 0.5); return; }
      it.vars.cool = o.cool;
      const mz = it.muzzle();
      const pd = DEFS[o.proj];
      const ang = Math.atan2(mz.dy, mz.dx);
      const p = new Item(pd, mz.x + mz.dx * 0.1, mz.y + mz.dy * 0.1, { angle: it.flip ? ang + Math.PI : ang, flip: it.flip });
      const v = it.main.getLinearVelocity();
      p.main.setLinearVelocity(V(v.x + mz.dx * o.speed, v.y + mz.dy * o.speed));
      p.vars.src = it; p.vars.t = 0;
      for (const b of it.bodies) setNoCollide(b, p.main, true);
      if (it.holder) for (const b of it.holder.bodies) setNoCollide(b, p.main, true);
      setTimeout(() => { if (!p.dead && !it.dead) for (const b of it.bodies) setNoCollide(b, p.main, false); }, 400);
      it.main.applyLinearImpulse(V(-mz.dx * o.recoil, -mz.dy * o.recoil), V(mz.x, mz.y), true);
      Sound.play(o.sound, mz.x, mz.y, 1);
      Effects.smoke(mz.x, mz.y, 6, [150, 150, 150], 0.8, 0.8);
      if (o.backblast) { const bp = it.worldPt(0, it.parts[0].spr.h / 2); Effects.smoke(bp[0], bp[1], 10, [170, 170, 170], 1.5, 1); for (let i = 0; i < 12; i++) Effects.fire(bp[0], bp[1], 0.7, -mz.dx * 4, -mz.dy * 4); }
      Effects.flash(mz.x, mz.y, 0.5, [255, 200, 120], 0.06);
      if (o.onFire) o.onFire(it, p);
    },
    update(it, dt) { it.vars.cool = (it.vars.cool || 0) - dt; },
    menu(it) { return [{ label: 'Disparar', fn: () => it.activate() }]; },
  };
}

def('taser', {

    const mz = it.muzzle();
    const h = rayFirst(mz.x, mz.y, mz.x + mz.dx * 9, mz.y + mz.dy * 9, (f) => { const t = thingOf(f); return t !== it && t !== it.holder && !f.isSensor(); });
    Sound.play('zap', mz.x, mz.y, 0.8);
    if (h) {
      it.vars.wire = { b: h.b, l: h.b.getLocalPoint(V(h.x, h.y)), t: 2.5 };
      const t = h.d.thing; if (t && t.isHuman) { t.shockHit(h.d.part, 1.4, h.x, h.y); t.vars = t.vars || {}; it.vars.victim = t; }
    } else Effects.tracer(mz.x, mz.y, mz.x + mz.dx * 9, mz.y + mz.dy * 9, [200, 200, 200], 0.4, 0.3);
  },
  update(it, dt) {
    it.vars.cool = (it.vars.cool || 0) - dt;
    const w = it.vars.wire;
    if (w) {

      const mz = it.muzzle(); const q = w.b.getWorldPoint(w.l);
      Effects.tracer(mz.x, mz.y, q.x, q.y, [220, 220, 210], 0.35, 0.02);

      if (it.vars.victim && !it.vars.victim.dead) { const L = it.vars.victim.limbOfBody(w.b); if (L) it.vars.victim.shock = Math.max(it.vars.victim.shock, 0.3); }

});

/* =========================================================================
   TERRENO Y MAPAS
   ========================================================================= */
class Terrain extends Thing {
  constructor(shapes) {
    super({ name: 'Terreno' });
    this.isTerrain = true;
    this.z = -1e6;
    this.shapes = shapes;
    const body = Phys.world.createBody({ type: 'static' });
    for (const s of shapes) {
      let shp;
      if (s.poly) shp = pl.Polygon(s.poly.map(([x, y]) => V(x, y)));
      else shp = pl.Box((s.x1 - s.x0) / 2, (s.y1 - s.y0) / 2, V((s.x0 + s.x1) / 2, (s.y0 + s.y1) / 2), 0);
      body.createFixture(shp, { friction: 0.85, restitution: 0.02, userData: { thing: this, part: s, mat: s.mat || 'concrete' } });
      if (s.poly) {
        const xs = s.poly.map((p) => p[0]), ys = s.poly.map((p) => p[1]);
        World.terrain.push({ x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys), poly: s.poly });
      } else World.terrain.push({ x0: s.x0, y0: s.y0, x1: s.x1, y1: s.y1 });
    }
    this.addBody(body, null);
    World.add(this);
  }
  isFlammable() { return false; }
  ignite() { return false; }
  stain() { return false; }
  destroy(silent) { if (this._allowDestroy) super.destroy(silent); }
}
let _concretePat = null, _concreteTile = null;
function concreteTile() {
  if (_concreteTile) return _concreteTile;
  _concreteTile = drawSprite(64, 64, (a) => {
    a.rect(0, 0, 64, 64, '#6d6f72');
    const R = a.R;
    for (let i = 0; i < 520; i++) { const x = (R() * 64) | 0, y = (R() * 64) | 0; a.px(x, y, shadeRgb(hexToRgb('#6d6f72'), 0.82 + R() * 0.3)); }
    for (let i = 0; i < 40; i++) { const x = (R() * 64) | 0, y = (R() * 64) | 0; a.px(x, y, '#5a5c5f'); a.px(x + 1, y, '#5f6164'); }
    for (let i = 0; i < 3; i++) { let x = R() * 64, y = R() * 64; for (let k = 0; k < 10; k++) { a.px(x | 0, y | 0, '#5e6063'); x += R() * 2 - 0.5; y += R() * 2 - 1; } }
  }, 7);
  return _concreteTile;
}
function drawTerrain(ctx, cam) {
  if (!_concretePat) { _concretePat = ctx.createPattern(concreteTile().canvas, 'repeat'); }
  if (_concretePat.setTransform) _concretePat.setTransform(new DOMMatrix().scaleSelf(PX, PX));
  const v = cam.bounds(1);
  for (const t of World.things) {
    if (!t.isTerrain) continue;
    for (const s of t.shapes) {
      ctx.fillStyle = _concretePat;
      if (s.poly) {
        ctx.beginPath(); s.poly.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); ctx.fill();
        // borde superior
        ctx.strokeStyle = '#8f9194'; ctx.lineWidth = PX * 2; ctx.stroke();
        continue;
      }

const Cam = {
  x: 0, y: -3, zoom: 80, w: 800, h: 600, dpr: 1, shake: 0, sx: 0, sy: 0, follow: null, tz: null,
  viewW() { return this.w / this.zoom; }, viewH() { return this.h / this.zoom; },
  toWorld(sx, sy) { return [(sx - this.w / 2) / this.zoom + this.x, (sy - this.h / 2) / this.zoom + this.y]; },
  toScreen(wx, wy) { return [(wx - this.x) * this.zoom + this.w / 2, (wy - this.y) * this.zoom + this.h / 2]; },
  bounds(pad = 0) { const hw = this.w / 2 / this.zoom + pad, hh = this.h / 2 / this.zoom + pad; return [this.x - hw, this.y - hh, this.x + hw, this.y + hh]; },
  visible(x, y) { const b = this.bounds(0.5); return x > b[0] && x < b[2] && y > b[1] && y < b[3]; },
  addShake(a) { if (Settings.shake) this.shake = Math.min(3, this.shake + a); },
  zoomAt(sx, sy, f) {
    const [wx, wy] = this.toWorld(sx, sy);
    this.zoom = clamp(this.zoom * f, 6, 600);
    const [nx, ny] = this.toWorld(sx, sy);
    this.x += wx - nx; this.y += wy - ny;
  },
  update(dt) {
    if (this.follow) {
      if (this.follow.dead) this.follow = null;
      else {
        const b = this.follow.isHuman ? this.follow.root.body : this.follow.main;
        if (b) { const p = b.getPosition(); this.x += (p.x - this.x) * Math.min(1, dt * 5); this.y += (p.y - this.y) * Math.min(1, dt * 5); }
      }
    }
    this.shake = Math.max(0, this.shake - dt * 3.5);
    const s = this.shake * this.shake * 14;
    this.sx = gauss() * s; this.sy = gauss() * s;
    this.x = clamp(this.x, -150, 150); this.y = clamp(this.y, -120, 60);
  },
  apply(ctx) {
    const z = this.zoom * this.dpr;
    ctx.setTransform(z, 0, 0, z, this.dpr * (this.w / 2 - this.x * this.zoom + this.sx), this.dpr * (this.h / 2 - this.y * this.zoom + this.sy));
  },
};

const Renderer = {
  canvas: null, ctx: null, light: null, lctx: null, frame: 0,
  init(canvas) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d', { alpha: false });
    this.light = makeCanvas(4, 4); this.lctx = this.light.getContext('2d');
    this.resize();
  },
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, Settings.hiDpi ? 2 : 1.25);
    Cam.dpr = dpr; Cam.w = window.innerWidth; Cam.h = window.innerHeight;
    this.canvas.width = Math.round(Cam.w * dpr); this.canvas.height = Math.round(Cam.h * dpr);
    this.light.width = Math.ceil(Cam.w / 2); this.light.height = Math.ceil(Cam.h / 2);
  },
  draw() {
    const ctx = this.ctx;
    this.frame++;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    // fondo
    const W = this.canvas.width, H = this.canvas.height;
    const amb = Settings.ambient;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#3a3f47'); g.addColorStop(0.65, '#4a5059'); g.addColorStop(1, '#575d66');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    Cam.apply(ctx);
    const v = Cam.bounds(0);
    // rejilla
    if (Settings.grid) {
      const step = Cam.zoom < 18 ? 5 : 1;
      ctx.lineWidth = 1 / Cam.zoom;
      ctx.strokeStyle = 'rgba(255,255,255,0.045)';
      ctx.beginPath();
      for (let x = Math.floor(v[0] / step) * step; x <= v[2]; x += step) { ctx.moveTo(x, v[1]); ctx.lineTo(x, v[3]); }
      for (let y = Math.floor(v[1] / step) * step; y <= v[3]; y += step) { ctx.moveTo(v[0], y); ctx.lineTo(v[2], y); }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.07)';
      ctx.beginPath();
      for (let x = Math.floor(v[0] / 10) * 10; x <= v[2]; x += 10) { ctx.moveTo(x, v[1]); ctx.lineTo(x, v[3]); }
      for (let y = Math.floor(v[1] / 10) * 10; y <= v[3]; y += 10) { ctx.moveTo(v[0], y); ctx.lineTo(v[2], y); }
      ctx.stroke();
    }
    drawTerrain(ctx, Cam);
    Decals.draw(ctx, Cam);
    // objetos ordenados por profundidad
    const list = [];
    for (const t of World.things) {
      if (t.isTerrain) continue;
      for (const p of t.parts) { if (p.body && !p.hidden) list.push(p); p._t = t; }
      if (t.def && t.def.draw) list.push({ _t: t, z: t.z + 0.45, custom: true });
    }
    for (const p of list) if (!p.custom) p.z = this.partZ(p);
    list.sort((a, b) => a.z - b.z);
    const vb = Cam.bounds(3);
    for (const p of list) {
      if (p.custom) { Cam.apply(ctx); p._t.def.draw(p._t, ctx); continue; }
      const b = p.body, pos = b.getPosition();
      if (pos.x < vb[0] || pos.x > vb[2] || pos.y < vb[1] || pos.y > vb[3]) continue;
      this.drawPart(ctx, p, b);
    }
    Cam.apply(ctx);
    // conexiones
    Connections.draw(ctx, Cam, Input.hoverConn);
    // efectos
    Effects.draw(ctx, Cam);
    // iluminación
    if (amb < 0.98) this.drawLighting(ctx, amb);
    // capas de interfaz en el mundo
    Input.drawWorld(ctx);
    // destello blanco
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (UI.flashA > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, UI.flashA)})`; ctx.fillRect(0, 0, W, H); }
  },
  partZ(p) {
    const t = p._t;
    let z = t.z + (p.zOff || 0);
    if (t.holder) { const h = t.holder; const r = Holding.map.get(t); if (r) z = h.z + (r.side === 'F' ? 0.395 : -0.405); }
    else if (t._stuckPart && t._stuckT && !t._stuckT.dead) z = t._stuckT.z + (t._stuckPart.zOff || 0) - 0.003;
    return z;
  },
  drawPart(ctx, p, b) {
    // transformación directa (más rápido que save/restore)
    const pos = b.getPosition(), a = b.getAngle(), spr = p.spr;
    const z = Cam.zoom * Cam.dpr, c = Math.cos(a), s = Math.sin(a), f = p.flip ? -1 : 1;
    const ox = (p.ox || 0) * PX, oy = (p.oy || 0) * PX;
    const wx = pos.x + c * ox - s * oy, wy = pos.y + s * ox + c * oy;
    const tx = Cam.dpr * (Cam.w / 2 - Cam.x * Cam.zoom + Cam.sx) + wx * z, ty = Cam.dpr * (Cam.h / 2 - Cam.y * Cam.zoom + Cam.sy) + wy * z;
    ctx.setTransform(z * c * f, z * s * f, -z * s, z * c, tx, ty);
    ctx.drawImage(spr.canvas, -spr.w / 2 * PX, -spr.h / 2 * PX, spr.w * PX, spr.h * PX);
  },
  drawLighting(ctx, amb) {
    const lc = this.lctx, L = this.light;
    const sw = L.width, sh = L.height, sc = 0.5;
    lc.globalCompositeOperation = 'source-over';
    const a = clamp(amb, 0, 1);
    const base = [lerp(18, 255, a), lerp(22, 255, a), lerp(40, 255, a)];
    lc.fillStyle = rgbStr(base, 1); lc.fillRect(0, 0, sw, sh);
    lc.globalCompositeOperation = 'lighter';
    const lights = Effects.lights.slice();
    Effects.collectLights(lights);
    for (const t of World.things) if (t.def && t.def.light && !t.dead) { const ls = t.def.light(t); if (ls) lights.push(...ls); }
    for (const t of World.things) if (t.fire > 0 && !t.dead) { const p = t.isHuman ? t.root.body.getPosition() : t.pos(); lights.push({ x: p.x, y: p.y - 0.3, r: 3 + t.fire * 2.5, col: [255, 140, 60], intensity: 0.7 * t.fire }); }
    for (const l of lights) {
      const [sx, sy] = Cam.toScreen(l.x, l.y);
      const r = l.r * Cam.zoom;
      const X = sx * sc, Y = sy * sc, R = r * sc;
      if (X + R < 0 || Y + R < 0 || X - R > sw || Y - R > sh) continue;
      const k = (l.temp ? l.life / Math.max(l.ml, 0.001) : 1) * l.intensity;
      const gr = lc.createRadialGradient(X, Y, 0, X, Y, R);
      gr.addColorStop(0, `rgba(${l.col[0]},${l.col[1]},${l.col[2]},${clamp(k, 0, 1)})`);
      gr.addColorStop(0.4, `rgba(${l.col[0]},${l.col[1]},${l.col[2]},${clamp(k * 0.45, 0, 1)})`);
      gr.addColorStop(1, `rgba(${l.col[0]},${l.col[1]},${l.col[2]},0)`);
      lc.fillStyle = gr;
      if (l.cone) {
        const ang = Math.atan2(l.dy, l.dx);
        lc.beginPath(); lc.moveTo(X, Y); lc.arc(X, Y, R, ang - l.cone, ang + l.cone); lc.closePath(); lc.fill();
        const g2 = lc.createRadialGradient(X, Y, 0, X, Y, R * 0.12);
        g2.addColorStop(0, `rgba(${l.col[0]},${l.col[1]},${l.col[2]},${clamp(k * 0.8, 0, 1)})`); g2.addColorStop(1, 'rgba(0,0,0,0)');
        lc.fillStyle = g2; lc.fillRect(X - R * 0.12, Y - R * 0.12, R * 0.24, R * 0.24);
      } else lc.fillRect(X - R, Y - R, R * 2, R * 2);
    }
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'multiply';
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(L, 0, 0, this.canvas.width, this.canvas.height);
    ctx.restore();
    ctx.imageSmoothingEnabled = false;
    Cam.apply(ctx);
  },
};

// contorno de un cuerpo (para resaltar)
function strokeBody(ctx, b, color, width) {
  const xf = b.getTransform();
  ctx.strokeStyle = color; ctx.lineWidth = width;
  for (let f = b.getFixtureList(); f; f = f.getNext()) {
    const s = f.getShape();
    ctx.beginPath();
    if (s.getType() === 'circle') {
      const c = pl.Transform.mul(xf, s.getCenter());
      ctx.arc(c.x, c.y, s.getRadius(), 0, TAU);
    } else if (s.getType() === 'polygon') {
      const vs = s.m_vertices;
      for (let i = 0; i < vs.length; i++) { const p = pl.Transform.mul(xf, vs[i]); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
      ctx.closePath();
    }
    ctx.stroke();
  }
}
function fillBody(ctx, b, color) {
  const xf = b.getTransform();
  ctx.fillStyle = color;
  for (let f = b.getFixtureList(); f; f = f.getNext()) {
    const s = f.getShape();
    ctx.beginPath();
    if (s.getType() === 'circle') { const c = pl.Transform.mul(xf, s.getCenter()); ctx.arc(c.x, c.y, s.getRadius(), 0, TAU); }
    else if (s.getType() === 'polygon') { const vs = s.m_vertices; for (let i = 0; i < vs.length; i++) { const p = pl.Transform.mul(xf, vs[i]); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); } ctx.closePath(); }
    ctx.fill();
  }
}

  init(canvas) {

  // ---------------- selección de objetos ----------------
  pickAt(x, y, rad) {

    queryAABB(x - r - 0.01, y - r - 0.01, x + r + 0.01, y + r + 0.01, (f) => {

function duplicateThing(t) {
  if (t.isTerrain) return;

const SaveSys = {
  key: 'pp_clon_escenas_v1',
  list() { try { return JSON.parse(localStorage.getItem(this.key) || '[]'); } catch (e) { return []; } },
  serialize() {
    const things = World.things.filter((t) => !t.isTerrain && !t.dead && (t.isHuman || (t.def && t.def.id && DEFS[t.def.id])));
    const out = { map: World.map, things: [], conns: [], date: Date.now() };
    const idx = new Map();
    things.forEach((t, i) => {
      idx.set(t, i);
      out.things.push({ id: t.isHuman ? t.kind : t.def.id, human: !!t.isHuman, flip: t.isHuman ? t.facing < 0 : t.flip, frozen: t.frozen, on: !!t.on, z: t.z,
        bodies: t.bodies.map((b) => { const p = b.getPosition(); return [+p.x.toFixed(4), +p.y.toFixed(4), +b.getAngle().toFixed(4)]; }) });
    });
    for (const c of Connections.list) {
      const ia = c.tA ? idx.get(c.tA) : -1, ib = c.tB ? idx.get(c.tB) : -1;
      if (ia === undefined || ib === undefined) continue;
      out.conns.push({ type: c.type, a: ia, ba: c.tA ? c.tA.bodies.indexOf(c.bA) : -1, la: [c.la.x, c.la.y], b: ib, bb: c.tB ? c.tB.bodies.indexOf(c.bB) : -1, lb: [c.lb.x, c.lb.y] });
    }
    out.count = out.things.length;
    return out;
  },
  save(i) { const l = this.list(); l[i] = this.serialize(); try { localStorage.setItem(this.key, JSON.stringify(l)); } catch (e) { UI.toast('No se pudo guardar (almacenamiento lleno)'); } },
  load(i) {
    const s = this.list()[i]; if (!s) return;
    loadMap(s.map || 'flat');
    const made = [];
    for (const r of s.things) {
      const p = r.bodies[0];
      let t;
      try {
        if (r.human) t = new Human(0, 0, { kind: r.id, flip: r.flip, def: DEFS[r.id] });
        else t = new Item(DEFS[r.id], p[0], p[1], { flip: r.flip, angle: p[2] });
      } catch (e) { made.push(null); continue; }
      t.bodies.forEach((b, k) => { const q = r.bodies[k]; if (q) b.setTransform(V(q[0], q[1]), q[2]); });
      if (r.frozen) t.setFrozen(true);
      if (r.on && !t.on && t.activate) { try { t.activate(); } catch (e) {} }
      t.z = r.z || t.z; World.zc = Math.max(World.zc, t.z);
      made.push(t);
    }
    for (const c of s.conns) {
      const ta = c.a >= 0 ? made[c.a] : null, tb = c.b >= 0 ? made[c.b] : null;
      if ((c.a >= 0 && !ta) || (c.b >= 0 && !tb)) continue;
      const bA = ta ? ta.bodies[c.ba] : null, bB = tb ? tb.bodies[c.bb] : null;
      const pa = bA ? bA.getWorldPoint(V(c.la[0], c.la[1])) : V(c.la[0], c.la[1]);
      const pb = bB ? bB.getWorldPoint(V(c.lb[0], c.lb[1])) : V(c.lb[0], c.lb[1]);
      Connections.create(c.type, bA, [pa.x, pa.y], bB, [pb.x, pb.y]);
    }
  },
};

    new Human(0.2, -0.9, { kind: 'human' });
    new Human(1.7, -0.9, { kind: 'human', flip: true });
    new Item(DEFS.crate, 3.3, -0.3, {});
    new Item(DEFS.barrel_explosive, 4.6, -0.3, {});
  },
  start(keep) {
    this.started = true;
    if (!keep) { /* conservar la escena de demostración */ }
    this.setPaused(false);
    Sound.unlock();
    UI.refreshTop();
    if (!this._welcomed) { this._welcomed = true; UI.toast(isTouchDevice ? 'Elige un objeto del catálogo y toca para colocarlo. Mantén pulsado para ver más opciones.' : 'Elige un objeto del catálogo y haz clic para colocarlo. Clic derecho: más opciones.', 4500); }
  },
  setPaused(p) {
    this.paused = p;
    if (Sound.ctx) { if (p) Sound.ctx.suspend(); else Sound.ctx.resume(); }
    UI.refreshTop && UI.root && UI.refreshTop();
  },
  togglePause() { this.setPaused(!this.paused); },
  toggleSlow() { this.slow = !this.slow; this.timeScale = this.slow ? Settings.slowmo : 1; UI.refreshTop(); UI.toast(this.slow ? 'Cámara lenta' : 'Velocidad normal'); },
  stepOnce(dt) {
    Phys.step(dt);
    const list = World.things.slice();
    for (const t of list) if (!t.dead && !t.isTerrain) { try { t.update(dt); } catch (e) { console.error(e); } }
    Stuck.update(dt);
    Connections.update(dt);
    Effects.update(dt);
  },
  loop(now) {
    let dt = (now - this.last) / 1000; this.last = now;
    if (!(dt > 0)) dt = 0.016;
    dt = Math.min(dt, 0.1);
    this.fps = lerp(this.fps, 1 / Math.max(dt, 0.001), 0.05);
    Input.update(dt);
    const menuBg = !this.started;
    if (!this.paused) {
      this.acc += dt * (menuBg ? 1 : this.timeScale);
      let n = 0;
      while (this.acc >= this.fixed && n < 4) { this.stepOnce(this.fixed); this.acc -= this.fixed; n++; }
      if (n >= 4) this.acc = 0;
    }
    Cam.update(dt);
    UI.update(dt);
    try { Renderer.draw(); } catch (e) { console.error(e); }
    requestAnimationFrame((t) => this.loop(t));
  },
};
window.addEventListener('load', () => Game.init());

</script>
